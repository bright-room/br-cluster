---
name: Yaml CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: yaml-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: yaml-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e  # v5
        with:
          version: "2026.9.11"
          install: true
          cache: true
      - run: yamllint -c .yamllint.yaml .
