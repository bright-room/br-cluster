---
name: Python CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: python-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@dba19683ed58901619b14f395a24841710cb4925  # v4
        with:
          version: "2026.7.18"
          install: true
          cache: true
      - run: uv sync --frozen --group dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      # サプライチェーン攻撃の検知に向けた計測(analyze モード)。
      # syscall を capture して falco-analyze ジョブで通信先・プロセスを可視化する。
      # 検知しても fail させない。
      - name: Start Falco
        uses: falcosecurity/falco-actions/start@558a3ceeee9403e1c875ffbeb704c34c93e24752 # main(タグ未発行のため commit を固定)
        with:
          mode: analyze
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@dba19683ed58901619b14f395a24841710cb4925  # v4
        with:
          version: "2026.7.18"
          install: true
          cache: true
      - run: uv sync --frozen --group dev
      - name: pytest with coverage
        run: uv run pytest -v --cov=cluster_forge --cov-report=term-missing --cov-report=xml
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        if: always()
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore
      - name: Stop Falco
        if: always()
        uses: falcosecurity/falco-actions/stop@558a3ceeee9403e1c875ffbeb704c34c93e24752 # main(タグ未発行のため commit を固定)
        with:
          mode: analyze

  # capture を解析して、ジョブ中の通信先 / DNS / プロセスをジョブサマリに出す。
  # 収集が目的のため、検知があっても fail させない。
  falco-analyze:
    needs: [test]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # 計測が目的のジョブなので、capture が無い等で失敗しても CI をブロックしない
    continue-on-error: true
    permissions:
      contents: read
      actions: read

    steps:
      - name: Analyze
        uses: falcosecurity/falco-actions/analyze@558a3ceeee9403e1c875ffbeb704c34c93e24752 # main(タグ未発行のため commit を固定)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
