name: Packer

on:
  pull_request:
    paths:
      - 'imager/**'
      - '.github/workflows/packer.yaml'

permissions:
  contents: read

concurrency:
  group: packer-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
      - uses: hashicorp/setup-packer@1aa358be5cf73883762b302a3a03abd66e75b232  # v3
        with:
          version: 1.15.1
      - run: packer fmt -check imager/
      # validate は本番 build と同じ mkaczanowski/packer-builder-arm を使う
      # (arm builder plugin がイメージに同梱されているため)
      - name: packer validate (in builder image)
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/imager:/build/packer" \
            -w /build/packer \
            mkaczanowski/packer-builder-arm:latest \
            validate -var 'hostname=ci' .
