---
name: Actions CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: actions-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: action-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785  # v5
        with:
          version: "2026.9.11"
          install: true
          cache: true
      - name: Run actionlint
        run: actionlint -color
