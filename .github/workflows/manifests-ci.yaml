---
name: Manifests CI

on:
  pull_request:
    paths:
      - 'manifests/**'
      - 'policies/**'
      - 'scripts/manifests-build.sh'
      - 'scripts/manifests-substitute-check.sh'
      - 'scripts/manifests-postbuild-fixtures.env'
      - 'Makefile'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'mise.toml'
      - '.github/workflows/manifests-ci.yaml'

permissions:
  contents: read

concurrency:
  group: manifests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  kustomize-build:
    name: kustomize-build + kubeconform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14  # v4
        with:
          version: "2026.7.7"
          install: true
          cache: true
      - name: Build & validate cluster overlays
        run: make manifests/build
      - name: Check Flux postBuild substituteFrom references
        run: make manifests/substitute-check

  flux-local:
    name: flux-local-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14  # v4
        with:
          version: "2026.7.7"
          install: true
          cache: true  # mise から helm / kustomize / flux2 を取得
      # flux-local は内部で pytest を起動し、root の pyproject.toml が
      # `testpaths = ["cli/tests"]` を指すため cli/tests/conftest.py が読み込まれる。
      # conftest が cluster_forge を import するので、project 依存ごと dev group で入れる
      # (flux-local は pyproject の dev group に追加済)。
      - run: uv sync --frozen --group dev
      # Flux Kustomization をたどって HelmRelease を offline render
      - name: flux-local test
        run: make manifests/flux-local

  policy-test:
    name: policy-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14  # v4
        with:
          version: "2026.7.7"
          install: true
          cache: true
      - run: make policy/test
