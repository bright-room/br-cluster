---
name: Manifests CI

on:
  pull_request:
    paths:
      - 'manifests/**'
      - 'policies/**'
      - 'scripts/manifests-build.sh'
      - 'Makefile'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'mise.toml'
      - 'mise.lock'
      - '.github/workflows/manifests-ci.yaml'

permissions:
  contents: read

env:
  # mise.lock に無い URL/checksum での install を拒否 (サプライチェーン対策)
  MISE_LOCKED: "1"

concurrency:
  group: manifests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  kustomize-build:
    name: kustomize-build + kubeconform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac  # v2
        with:
          install: true
          cache: true
      - name: Build & validate cluster overlays
        run: make manifests/build

  flux-local:
    name: flux-local-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac  # v2
        with:
          install: true
          cache: true  # mise から helm / kustomize / flux2 を取得
      # flux-local は内部で pytest を起動し、root の pyproject.toml が
      # `testpaths = ["cli/tests"]` を指すため cli/tests/conftest.py が読み込まれる。
      # conftest が cluster_forge を import するので、project 依存ごと dev group で入れる
      # (flux-local は pyproject の dev group に追加済)。
      - run: uv sync --frozen --group dev
      # Flux Kustomization をたどって HelmRelease を offline render
      - name: flux-local test
        run: make manifests/flux-local

  policy-test:
    name: policy-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac  # v2
        with:
          install: true
          cache: true
      - run: make policy/test
