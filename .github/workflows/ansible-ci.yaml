---
name: Ansible CI

on:
  pull_request:
    paths:
      - 'provisioner/inventories/**'
      - 'provisioner/playbooks/**'
      - 'provisioner/roles/**'
      - 'provisioner/tasks/**'
      - 'provisioner/ansible.cfg'
      - 'provisioner/requirements.yaml'
      - '.ansible-lint'
      - '.github/workflows/ansible-ci.yaml'

permissions:
  contents: read

env:
  # mise.lock に無い URL/checksum での install を拒否 (サプライチェーン対策)
  MISE_LOCKED: "1"

concurrency:
  group: ansible-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: ansible-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac  # v2
        with:
          install: true
          cache: true
      - name: Install collections
        working-directory: provisioner
        run: ansible-galaxy collection install -r requirements.yaml -p ./collections
      - name: ansible-lint
        working-directory: provisioner
        run: ansible-lint playbooks/
