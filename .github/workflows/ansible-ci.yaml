---
name: Ansible CI

on:
  pull_request:
    paths:
      - 'provisioner/inventories/**'
      - 'provisioner/playbooks/**'
      - 'provisioner/roles/**'
      - 'provisioner/tasks/**'
      - 'provisioner/ansible.cfg'
      - 'provisioner/requirements.yaml'
      - '.ansible-lint'
      - 'mise.toml'
      - '.github/workflows/ansible-ci.yaml'

permissions:
  contents: read

concurrency:
  group: ansible-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: ansible-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c  # v4
        with:
          version: "2026.7.13"
          install: true
          cache: true
      - name: Install collections
        working-directory: provisioner
        run: ansible-galaxy collection install -r requirements.yaml -p ./collections
      - name: ansible-lint
        working-directory: provisioner
        run: ansible-lint playbooks/
