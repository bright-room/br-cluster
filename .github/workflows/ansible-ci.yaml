---
name: Ansible CI

on:
  pull_request:
    paths:
      - 'provisioner/inventories/**'
      - 'provisioner/playbooks/**'
      - 'provisioner/roles/**'
      - 'provisioner/tasks/**'
      - 'provisioner/ansible.cfg'
      - 'provisioner/requirements.yaml'
      - '.ansible-lint'
      - 'mise.toml'
      - '.github/workflows/ansible-ci.yaml'

permissions:
  contents: read

concurrency:
  group: ansible-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: ansible-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14  # v4
        with:
          version: "2026.7.7"
          install: true
          cache: true
      - name: Install collections
        working-directory: provisioner
        run: ansible-galaxy collection install -r requirements.yaml -p ./collections
      - name: ansible-lint
        working-directory: provisioner
        run: ansible-lint playbooks/
