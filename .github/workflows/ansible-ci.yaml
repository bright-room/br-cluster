---
name: Ansible CI

on:
  pull_request:
    paths:
      - 'provisioner/inventories/**'
      - 'provisioner/playbooks/**'
      - 'provisioner/roles/**'
      - 'provisioner/tasks/**'
      - 'provisioner/ansible.cfg'
      - 'provisioner/requirements.yaml'
      - '.ansible-lint'
      - '.github/workflows/ansible-ci.yaml'

permissions:
  contents: read

concurrency:
  group: ansible-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: ansible-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.14'
          cache: pip
      - run: pip install 'ansible-lint[community]' ansible-core
      - name: Install collections
        working-directory: provisioner
        run: ansible-galaxy collection install -r requirements.yaml -p ./collections
      - name: ansible-lint
        working-directory: provisioner
        run: ansible-lint playbooks/
