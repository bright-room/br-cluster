name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  python-lint:
    name: Python Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v8.1.0

      - run: uv run ruff check .

      - run: uv run ruff format --check .

  python-test:
    name: Python Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v8.1.0

      - run: uv run pytest -v

  packer-validate:
    name: Packer Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: hashicorp/setup-packer@main

      - name: Packer fmt check
        run: packer fmt -check imager/

  policy-test:
    name: Policy Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: jdx/mise-action@v2
        with:
          install: true
          cache: true

      - run: make policy/test
