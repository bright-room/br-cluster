---
name: Security scan

on:
  pull_request:
  schedule:
    # 毎週月曜 18:00 UTC (JST 火曜 03:00) に default branch で実行
    # 既存依存に新規 CVE が出ていないかを定期検査する
    - cron: '0 18 * * 1'

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # secret scan は GitHub 標準の Secret Scanning に委譲 (Public repo なら無償)
  # Settings → Code security → Secret scanning を ON にすること
  osv-scanner:
    name: osv-scan
    # reusable workflow 側で permissions / SARIF upload を持つ
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@9a498708959aeaef5ef730655706c5a1df1edbc2  # v2.3.8
    with:
      # uv.lock / GitHub Actions / Dockerfile / k8s manifest を再帰スキャン
      scan-args: |-
        --recursive
        --skip-git
        ./
