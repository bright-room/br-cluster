---
name: Packer CI

on:
  pull_request:
    paths:
      - 'imager/**'
      - 'Makefile'
      - 'mise.toml'
      - '.github/workflows/packer-ci.yaml'

permissions:
  contents: read

concurrency:
  group: packer-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # `packer validate` は mkaczanowski/packer-builder-arm の entrypoint が
  # binfmt_misc セットアップを要求するため `--privileged` 必須。
  # CI runner に privileged を与える価値が薄いので fmt のみで運用する。
  fmt:
    name: packer-fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
      - uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151  # v4
        with:
          install: true
          cache: true
      - run: make packer/fmt
