---
name: Packer CI

on:
  pull_request:
    paths:
      - 'imager/**'
      - 'Makefile'
      - 'mise.toml'
      - '.github/workflows/packer-ci.yaml'

permissions:
  contents: read

concurrency:
  group: packer-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # `packer validate` は mkaczanowski/packer-builder-arm の entrypoint が
  # binfmt_misc セットアップを要求するため `--privileged` 必須。
  # CI runner に privileged を与える価値が薄いので fmt のみで運用する。
  fmt:
    name: packer-fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14  # v4
        with:
          version: "2026.7.7"
          install: true
          cache: true
      - run: make packer/fmt
