---
name: Packer CI

on:
  pull_request:
    paths:
      - 'imager/**'
      - 'Makefile'
      - 'mise.toml'
      - '.github/workflows/packer-ci.yaml'

permissions:
  contents: read

concurrency:
  group: packer-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # `packer validate` は mkaczanowski/packer-builder-arm の entrypoint が
  # binfmt_misc セットアップを要求するため `--privileged` 必須。
  # CI runner に privileged を与える価値が薄いので fmt のみで運用する。
  fmt:
    name: packer-fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6
        with:
          persist-credentials: false
      - uses: jdx/mise-action@dba19683ed58901619b14f395a24841710cb4925  # v4
        with:
          version: "2026.6.6"
          install: true
          cache: true
      - run: make packer/fmt
