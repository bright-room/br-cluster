---
name: Packer CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: packer-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # `packer validate` は mkaczanowski/packer-builder-arm の entrypoint が
  # binfmt_misc セットアップを要求するため `--privileged` 必須。
  # CI runner に privileged を与える価値が薄いので fmt のみで運用する。
  fmt:
    name: packer-fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d  # v5
        with:
          version: "2026.9.11"
          install: true
          cache: true
      - run: make packer/fmt
