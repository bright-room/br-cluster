---
- name: Fetch garage operator credentials
  block:
    - name: Get operator credentials from 1Password
      onepassword.connect.field_info:
        vault: "{{ vault_id }}"
        item: "garage"
        section: "{{ item.0.name }}"
        field: "{{ item.1 }}"
      register: _garage_operators_raw
      loop: "{{ garage.provisioning.users | product(['access_key_id', 'secret_access_key']) | list }}"
      no_log: true
      delegate_to: localhost

    - name: Cache garage operator credentials
      set_fact:
        secret_garage_operators: >-
          {%- set ns = namespace(d={}) -%}
          {%- for user in garage.provisioning.users -%}
            {%- set ns.d = ns.d | combine({
              user.name: {
                'access_key_id': _garage_operators_raw.results[loop.index0 * 2].field.value,
                'secret_access_key': _garage_operators_raw.results[loop.index0 * 2 + 1].field.value
              }
            }) -%}
          {%- endfor -%}
          {{ ns.d }}
        cacheable: true
      no_log: true
  run_once: true
  when:
    - secret_garage_operators is not defined
    - garage.provisioning.users is defined
  become: false
