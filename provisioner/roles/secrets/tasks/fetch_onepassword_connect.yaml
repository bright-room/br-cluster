---
# NOTE: This role uses the uri module instead of onepassword.connect.field_info
# to avoid Ansible's no_log sanitization issue. The field_info module's argument_spec
# marks the token parameter as no_log=True, which causes Ansible to replace any
# substring of OP_CONNECT_TOKEN found in the module's return values with
# VALUE_SPECIFIED_IN_NO_LOG_PARAMETER.
- name: Fetch 1Password Connect credentials
  block:
    - name: Find item ID for br-cluster-prod-access-credentials
      uri:
        url: "{{ lookup('env', 'OP_CONNECT_HOST') }}/v1/vaults/{{ vault_id }}/items?filter=title%20eq%20%22br-cluster-prod-access-credentials%22"
        headers:
          Authorization: "Bearer {{ lookup('env', 'OP_CONNECT_TOKEN') }}"
        return_content: true
      register: _op_item_list
      delegate_to: localhost

    - name: Get full item details
      uri:
        url: "{{ lookup('env', 'OP_CONNECT_HOST') }}/v1/vaults/{{ vault_id }}/items/{{ _op_item_list.json[0].id }}"
        headers:
          Authorization: "Bearer {{ lookup('env', 'OP_CONNECT_TOKEN') }}"
        return_content: true
      register: _op_item_detail
      delegate_to: localhost
      no_log: true

    - name: Cache 1Password Connect credentials
      set_fact:
        secret_op_connect_token: "{{ _op_item_detail.json.fields | selectattr('label', 'eq', 'connect_token') | map(attribute='value') | first }}"
        secret_op_credentials_json: "{{ _op_item_detail.json.fields | selectattr('label', 'eq', 'json') | map(attribute='value') | first }}"
        cacheable: true
      no_log: true
  run_once: true
  when: secret_op_connect_token is not defined
  become: false
