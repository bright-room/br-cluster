---
- name: Fetch k3s cluster token
  run_once: true
  when: secrets_k3s_token is not defined
  become: false
  block:
    - name: Get k3s token
      onepassword.connect.field_info:
        vault: "{{ vault_id }}"
        item: "k3s"
        field: "token"
      register: _secrets_k3s_token_raw
      no_log: true
      delegate_to: localhost

    - name: Cache k3s token
      set_fact:
        secrets_k3s_token: "{{ _secrets_k3s_token_raw.field.value }}"
        cacheable: true
      no_log: true
