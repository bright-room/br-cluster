---
# unattended-upgrades を全ホストで有効化し、security pocket のみを毎日適用する。
# 通知は apt-daily-upgrade.service の ExecStartPost に hook を挟んで Discord に POST する
# (DPkg::Post-Invoke だと Ansible の手動 apt 実行でも発火してしまうため避ける)。

- name: Install unattended-upgrades
  apt:
    name: unattended-upgrades
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Configure unattended-upgrades policy
  template:
    src: 50unattended-upgrades.j2
    dest: /etc/apt/apt.conf.d/50unattended-upgrades
    owner: root
    group: root
    mode: "0644"

- name: Enable apt periodic actions
  template:
    src: 20auto-upgrades.j2
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    owner: root
    group: root
    mode: "0644"

- name: Install Discord webhook URL env file
  template:
    src: uu-discord-hook.env.j2
    dest: "{{ unattended_upgrades_discord_webhook_env_file }}"
    owner: root
    group: root
    mode: "0600"
  when: secrets_discord_webhook is defined
  no_log: true

- name: Install Discord hook script
  template:
    src: uu-discord-hook.sh.j2
    dest: "{{ unattended_upgrades_discord_hook_script }}"
    owner: root
    group: root
    mode: "0755"

- name: Ensure systemd drop-in directory for apt-daily-upgrade.service
  file:
    path: /etc/systemd/system/apt-daily-upgrade.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Wire Discord hook into apt-daily-upgrade.service
  template:
    src: apt-daily-upgrade-discord-hook.conf.j2
    dest: /etc/systemd/system/apt-daily-upgrade.service.d/discord-hook.conf
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd

- name: Enable apt-daily timers
  systemd:
    name: "{{ item }}"
    enabled: true
    state: started
    daemon_reload: true
  loop:
    - apt-daily.timer
    - apt-daily-upgrade.timer
