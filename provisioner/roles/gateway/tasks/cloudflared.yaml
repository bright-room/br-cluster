# cloudflared on br-gateway1: br-infra Tunnel client.
# WARP private network 経由で mac から 172.22.52.0/24 (kubectl / SSH) に到達するための
# Tunnel transport を提供する。Tunnel 本体・Route・Gateway Policy・WARP Profile は
# br-cloudflare-terraform で IaC 管理 (zero_trust state)。
# 詳細: docs/proposals/cloudflare-tunnel-warp-private-network.md
- name: Add Cloudflare apt signing key
  ansible.builtin.get_url:
    url: https://pkg.cloudflare.com/cloudflare-main.gpg
    dest: /usr/share/keyrings/cloudflare-main.gpg
    mode: "0644"
    force: false

- name: Add Cloudflare apt repository
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/usr/share/keyrings/cloudflare-main.gpg] https://pkg.cloudflare.com/cloudflared {{ ansible_distribution_release }} main"
    filename: cloudflared
    state: present

- name: Install cloudflared
  ansible.builtin.apt:
    name: cloudflared
    state: present
    update_cache: true

- name: Ensure /etc/cloudflared directory exists
  ansible.builtin.file:
    path: /etc/cloudflared
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Write cloudflared credentials.json
  ansible.builtin.copy:
    # cloudflared docs 準拠フォーマット: AccountTag / TunnelSecret / TunnelID
    content: |
      {"AccountTag":"{{ secrets_cloudflared_br_infra.account_tag }}","TunnelSecret":"{{ secrets_cloudflared_br_infra.tunnel_secret }}","TunnelID":"{{ secrets_cloudflared_br_infra.tunnel_id }}"}
    dest: /etc/cloudflared/credentials.json
    owner: root
    group: root
    mode: "0600"
  no_log: true
  notify: Restart cloudflared

- name: Write cloudflared config.yaml
  ansible.builtin.template:
    src: cloudflared-config.yaml.j2
    dest: /etc/cloudflared/config.yaml
    owner: root
    group: root
    mode: "0644"
  notify: Restart cloudflared

# cloudflared apt パッケージは systemd unit を同梱するが、初回 install 時点では
# unit ファイルを `cloudflared service install` 経由で書き出す必要がある。
# config.yaml と credentials.json が両方揃った状態で実行する。
- name: Install cloudflared systemd service
  ansible.builtin.command:
    cmd: cloudflared --config /etc/cloudflared/config.yaml service install
    creates: /etc/systemd/system/cloudflared.service

- name: Enable and start cloudflared service
  ansible.builtin.systemd:
    name: cloudflared
    enabled: true
    state: started
    daemon_reload: true
