---
- name: restart node_exporter
  systemd:
    name: node_exporter
    state: restarted
    daemon_reload: true

- name: restart rpi-metrics timer
  systemd:
    name: rpi-metrics.timer
    state: restarted
    enabled: true
    daemon_reload: true

- name: restart alloy
  systemd:
    name: alloy
    state: restarted
    daemon_reload: true
