---
- name: Get system architecture
  command: dpkg --print-architecture
  register: system_arch
  changed_when: false

- name: Map architecture for node_exporter
  set_fact:
    ne_arch: "{{ 'arm64' if system_arch.stdout == 'arm64' else 'amd64' }}"

- name: Check if node_exporter binary exists
  stat:
    path: "{{ install_dir }}/node_exporter"
  register: ne_check

- name: Install node_exporter
  block:
    - name: Download node_exporter
      get_url:
        url: "https://github.com/prometheus/node_exporter/releases/download/v{{ versions.node_exporter }}/node_exporter-{{ versions.node_exporter }}.linux-{{ ne_arch }}.tar.gz"
        dest: "{{ tmp_dir }}/node_exporter.tar.gz"
        mode: "0644"

    - name: Extract node_exporter
      unarchive:
        src: "{{ tmp_dir }}/node_exporter.tar.gz"
        dest: "{{ tmp_dir }}"
        remote_src: true

    - name: Copy node_exporter binary
      copy:
        src: "{{ tmp_dir }}/node_exporter-{{ versions.node_exporter }}.linux-{{ ne_arch }}/node_exporter"
        dest: "{{ install_dir }}/node_exporter"
        mode: "0755"
        remote_src: true
  when: not ne_check.stat.exists

- name: Copy node_exporter systemd service
  template:
    src: node_exporter.service.j2
    dest: /etc/systemd/system/node_exporter.service
    mode: "0644"
  notify: Restart node_exporter

- name: Enable and start node_exporter
  systemd:
    name: node_exporter
    state: started
    enabled: true
    daemon_reload: true
