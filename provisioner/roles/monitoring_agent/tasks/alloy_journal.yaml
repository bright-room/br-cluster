---
# Installs grafana/alloy as a systemd service that ships systemd-journald to
# Loki via the internal Envoy Gateway. See docs/observability-plan.md P2-C.

- name: Get system architecture
  command: dpkg --print-architecture
  register: system_arch_alloy
  changed_when: false

- name: Map architecture for alloy
  set_fact:
    alloy_arch: "{{ 'arm64' if system_arch_alloy.stdout == 'arm64' else 'amd64' }}"

- name: Ensure unzip is installed (alloy release is zip-packaged)
  apt:
    name: unzip
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Ensure alloy system user exists
  user:
    name: alloy
    system: true
    shell: /usr/sbin/nologin
    home: "{{ alloy_journal.data_dir }}"
    create_home: false
    groups: systemd-journal
    append: true

- name: Check if alloy binary exists at expected version
  command: "{{ install_dir }}/alloy --version"
  register: alloy_version_check
  changed_when: false
  failed_when: false

- name: Install alloy
  when: >-
    alloy_version_check.rc != 0
    or versions.alloy not in (alloy_version_check.stdout | default(''))
  block:
    - name: Download alloy
      get_url:
        url: "https://github.com/grafana/alloy/releases/download/v{{ versions.alloy }}/alloy-linux-{{ alloy_arch }}.zip"
        dest: "{{ tmp_dir }}/alloy.zip"
        mode: "0644"

    - name: Extract alloy
      unarchive:
        src: "{{ tmp_dir }}/alloy.zip"
        dest: "{{ tmp_dir }}"
        remote_src: true

    - name: Install alloy binary
      copy:
        src: "{{ tmp_dir }}/alloy-linux-{{ alloy_arch }}"
        dest: "{{ install_dir }}/alloy"
        mode: "0755"
        remote_src: true
      notify: Restart alloy

- name: Create alloy config directory
  file:
    path: "{{ alloy_journal.config_dir }}"
    state: directory
    owner: root
    group: alloy
    mode: "0750"

- name: Create alloy data directory
  file:
    path: "{{ alloy_journal.data_dir }}"
    state: directory
    owner: alloy
    group: alloy
    mode: "0750"

- name: Deploy alloy config (journald → Loki)
  template:
    src: alloy-journal.alloy.j2
    dest: "{{ alloy_journal.config_dir }}/config.alloy"
    owner: root
    group: alloy
    mode: "0640"
  notify: Restart alloy

- name: Deploy alloy systemd unit
  template:
    src: alloy.service.j2
    dest: /etc/systemd/system/alloy.service
    mode: "0644"
  notify: Restart alloy

- name: Enable and start alloy
  systemd:
    name: alloy
    state: started
    enabled: true
    daemon_reload: true
