---
# Installs a 60-second systemd timer that collects Raspberry Pi-specific
# metrics (throttle / clock / voltage) via vcgencmd and writes them into the
# node_exporter textfile directory.
#
# Enabled only when /dev/vcio (the GPU mailbox character device) is present,
# so non-Pi hosts silently no-op. The script itself is also defensive —
# each vcgencmd is timeout-bounded and the previous .prom stays in place on
# any failure.
- name: Check if /dev/vcio (GPU mailbox) exists
  stat:
    path: /dev/vcio
  register: vcio_check

- name: Install rpi-metrics timer
  when: vcio_check.stat.exists
  block:
    - name: Copy rpi-metrics.sh
      template:
        src: rpi-metrics.sh.j2
        dest: /usr/local/bin/rpi-metrics.sh
        mode: "0755"
      notify: restart rpi-metrics timer

    - name: Copy rpi-metrics.service
      template:
        src: rpi-metrics.service.j2
        dest: /etc/systemd/system/rpi-metrics.service
        mode: "0644"
      notify: restart rpi-metrics timer

    - name: Copy rpi-metrics.timer
      template:
        src: rpi-metrics.timer.j2
        dest: /etc/systemd/system/rpi-metrics.timer
        mode: "0644"
      notify: restart rpi-metrics timer

    - name: Enable and start rpi-metrics.timer
      systemd:
        name: rpi-metrics.timer
        state: started
        enabled: true
        daemon_reload: true
