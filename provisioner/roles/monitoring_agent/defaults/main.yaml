---
node_exporter:
  # :9100 is already occupied by the prometheus-node-exporter DaemonSet on
  # k3s nodes (hostNetwork). The systemd-managed instance binds :9101 so both
  # coexist on the same node — see docs/observability-plan.md P1-A.
  port: 9101
  textfile_dir: /run/node_exporter/textfile

# Grafana Alloy shipping systemd-journald → Loki (P2-C). Off by default so
# the role can still be applied in isolation; enabled for br_cluster via
# group_vars/all/main.yaml.
alloy_journal_enabled: false
# Loki push 先 URL (デフォルトはクラスタ外ノード向け = internal Gateway ドメイン)。
# k3s ノードは group_vars/clusters.yaml で localhost NodePort に上書きする。
# 分ける理由: k3s ノードだと LB IP (172.22.10.71) への自ノード hairpin が
# Cilium L2 lease holder で失敗するため NodePort + eBPF kube-proxy で回避。
# 逆に gateway / external は k8s 外なので NodePort が使えず、かつ lease
# holder になり得ないのでドメイン経由が安全。
alloy_journal_loki_push_url: "http://loki-push.cluster-internal.bright-room.net/loki/api/v1/push"
alloy_journal:
  # Alloy HTTP server (内部 metrics / debug UI) を LAN 経由で scrape できるよう
  # 0.0.0.0:12345 に bind。エンドポイントは
  # manifests/platform/kube-prometheus-stack/host-monitoring/alloy-* で
  # EndpointSlice 化し、Prometheus から job=alloy-host として収集する。
  # gateway ノードは nftables の in_tcp_accept に 12345 を追加済
  # (inventories/base/host_vars/br-gateway1.yaml)。
  http_listen_addr: "0.0.0.0:12345"
  config_dir: /etc/alloy
  data_dir: /var/lib/alloy
