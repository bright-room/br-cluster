---
- name: Install Caddy prerequisites
  apt:
    name:
      - debian-keyring
      - debian-archive-keyring
      - apt-transport-https
      - curl
    state: present

- name: Add Caddy GPG key
  get_url:
    url: https://dl.cloudsmith.io/public/caddy/stable/gpg.key
    dest: /usr/share/keyrings/caddy-stable-archive-keyring.asc
    mode: "0644"

- name: Add Caddy apt repository
  apt_repository:
    repo: "deb [signed-by=/usr/share/keyrings/caddy-stable-archive-keyring.asc] https://dl.cloudsmith.io/public/caddy/stable/deb/debian any-version main"
    state: present
    filename: caddy-stable
    update_cache: true

- name: Install Caddy
  apt:
    name: caddy
    state: present

- name: Add caddy user to garage group for SSL cert access
  user:
    name: caddy
    groups: "{{ garage.operator.group }}"
    append: true
  notify: Restart caddy

- name: Ensure Garage SSL directory is group-readable
  file:
    path: "{{ garage.ssl_dir }}"
    mode: "0750"
    state: directory

- name: Copy Caddyfile
  template:
    src: Caddyfile.j2
    dest: /etc/caddy/Caddyfile
    owner: root
    group: root
    mode: "0644"
  notify: Reload caddy

- name: Create Caddy systemd override directory
  file:
    path: /etc/systemd/system/caddy.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Copy Caddy systemd override
  template:
    src: caddy-override.conf.j2
    dest: /etc/systemd/system/caddy.service.d/override.conf
    owner: root
    group: root
    mode: "0644"
  register: caddy_override

- name: Reload systemd daemon
  systemd:
    daemon_reload: true
  when: caddy_override.changed

- name: Enable and start Caddy
  systemd:
    name: caddy
    state: started
    enabled: true
