---
- name: restart garage
  service:
    name: garage
    state: restarted


# Caddyfile で admin API を無効化 (admin off) しているため systemctl reload が
# admin API 経由の CLI 呼び出しで stuck する。restart で置き換える。
- name: reload caddy
  service:
    name: caddy
    state: restarted

- name: restart caddy
  service:
    name: caddy
    state: restarted
