---
# --- Pre setup ---
- name: Add garage operator user
  user:
    name: "{{ garage.operator.user }}"
    shell: "/usr/sbin/nologin"
    create_home: false
    system: true
    state: present

- name: Add garage operator group
  group:
    name: "{{ garage.operator.group }}"
    state: present

- name: Create garage directories
  file:
    path: "{{ item }}"
    group: "{{ garage.operator.group }}"
    owner: "{{ garage.operator.user }}"
    mode: "0750"
    state: directory
  with_items:
    - "{{ garage.data_dir }}"
    - "{{ garage.meta_dir }}"
    - "{{ garage.config_dir }}"
    - "{{ garage.ssl_dir }}"

- name: Copy SSL certificates for Garage
  copy:
    src: "{{ lets_encrypt.certificate_dir }}/{{ garage_tls_domain }}/{{ item.src }}"
    dest: "{{ garage.ssl_dir }}/{{ item.dest }}"
    group: "{{ garage.operator.group }}"
    owner: "{{ garage.operator.user }}"
    mode: "0640"
    remote_src: true
  loop:
    - { src: "fullchain.pem", dest: "public.crt" }
    - { src: "privkey.pem", dest: "private.key" }

- name: Add certificate update script
  template:
    src: garage-ssl-update.sh.j2
    dest: "{{ lets_encrypt.deploy_hook_dir }}/garage-ssl-update.sh"
    owner: "root"
    group: "root"
    mode: "0700"
    backup: true

# --- Install ---
- name: Get system architecture
  command: dpkg --print-architecture
  register: system_arch
  changed_when: false

- name: Map architecture to Garage naming
  set_fact:
    garage_arch: "{{ 'aarch64' if system_arch.stdout == 'arm64' else 'x86_64' }}"

- name: Download Garage binary
  get_url:
    url: "https://garagehq.deuxfleurs.fr/_releases/{{ versions.garage }}/{{ garage_arch }}-unknown-linux-musl/garage"
    dest: "{{ install_dir }}/garage"
    mode: "0755"
  notify: Restart garage

# --- Configure ---
- name: Copy Garage configuration
  template:
    src: "garage.toml.j2"
    dest: "{{ garage.config_dir }}/garage.toml"
    owner: "{{ garage.operator.user }}"
    group: "{{ garage.operator.group }}"
    mode: "0640"
  notify: Restart garage

- name: Copy Garage systemd service
  template:
    src: "garage.service.j2"
    dest: "/etc/systemd/system/garage.service"
    mode: "0644"
  notify: Restart garage

- name: Enable and start Garage
  systemd:
    name: garage
    state: started
    enabled: true
    daemon_reload: true

- name: Wait for Garage to be ready
  wait_for:
    port: "{{ garage.server.s3_port }}"
    host: "127.0.0.1"
    timeout: 30

# --- Layout configuration ---
- name: Get Garage node ID
  command: garage node id -q
  register: garage_node_id
  changed_when: false
  environment:
    GARAGE_CONFIG_FILE: "{{ garage.config_dir }}/garage.toml"

- name: Assign layout to node
  command: >
    garage layout assign
    {{ garage_node_id.stdout | trim | split('@') | first }}
    -z dc1 -c {{ garage.capacity }}
  register: layout_assign
  changed_when: '"already assigned" not in layout_assign.stderr'
  failed_when: false
  environment:
    GARAGE_CONFIG_FILE: "{{ garage.config_dir }}/garage.toml"

- name: Get staged layout version
  shell: >
    garage layout show 2>&1
    | grep -oP 'apply --version \K\d+'
  register: staged_layout_version
  changed_when: false
  failed_when: false
  environment:
    GARAGE_CONFIG_FILE: "{{ garage.config_dir }}/garage.toml"

- name: Apply layout
  command: >
    garage layout apply
    --version {{ staged_layout_version.stdout }}
  when: staged_layout_version.stdout | length > 0
  register: layout_apply
  changed_when: '"already up to date" not in layout_apply.stderr'
  failed_when: false
  environment:
    GARAGE_CONFIG_FILE: "{{ garage.config_dir }}/garage.toml"
