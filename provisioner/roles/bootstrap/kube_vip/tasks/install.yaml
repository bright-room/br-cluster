---
- name: Check if kube-vip Helm release exists
  command: helm status kube-vip -n {{ kube_vip_namespace }}
  register: kube_vip_status
  failed_when: false
  changed_when: false

- name: Install kube-vip via Helm (bootstrap only)
  command: >
    helm install kube-vip
    kube-vip
    --repo https://kube-vip.github.io/helm-charts
    --version {{ kube_vip_version }}
    --namespace {{ kube_vip_namespace }}
    --values {{ kube_vip_values_base }}
    --values {{ kube_vip_values_overlay }}
    --set config.address={{ kube_vip_address }}
  register: kube_vip_apply
  when: kube_vip_status.rc != 0
  changed_when: "'STATUS: deployed' in kube_vip_apply.stdout"

- name: Wait for kube-vip DaemonSet to be ready
  command: >
    kubectl rollout status daemonset/kube-vip -n {{ kube_vip_namespace }} --timeout=300s
  retries: 10
  delay: 15
  register: kube_vip_rollout
  until: kube_vip_rollout.rc == 0
