---
- name: Create required namespaces
  command: >
    kubectl create namespace {{ item }}
  loop:
    - "{{ bootstrap_secrets_flux_namespace }}"
    - "{{ bootstrap_secrets_onepassword_namespace }}"
  register: _ns_result
  failed_when:
    - _ns_result.rc != 0
    - '"already exists" not in _ns_result.stderr'

- name: Apply flux-system secret
  command: kubectl apply -f -
  args:
    stdin: |
      apiVersion: v1
      kind: Secret
      metadata:
        name: flux-system
        namespace: {{ bootstrap_secrets_flux_namespace }}
      type: Opaque
      data:
        githubAppID: {{ secret_github_app_id | b64encode }}
        githubAppInstallationID: {{ secret_github_app_installation_id | b64encode }}
        githubAppPrivateKey: {{ secret_github_app_private_key | b64encode }}
  no_log: true

- name: Apply 1Password Connect token secret
  command: kubectl apply -f -
  args:
    stdin: |
      apiVersion: v1
      kind: Secret
      metadata:
        name: onepassword-connect-token
        namespace: {{ bootstrap_secrets_onepassword_namespace }}
      type: Opaque
      data:
        token: {{ secret_op_connect_token | b64encode }}
  no_log: true

- name: Apply 1Password credentials secret
  command: kubectl apply -f -
  args:
    stdin: |
      apiVersion: v1
      kind: Secret
      metadata:
        name: op-credentials
        namespace: {{ bootstrap_secrets_onepassword_namespace }}
      type: Opaque
      data:
        1password-credentials.json: {{ secret_op_credentials_json | b64encode }}
  no_log: true
