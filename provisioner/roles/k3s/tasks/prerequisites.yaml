---
- name: Install k3s prerequisite packages
  apt:
    name: "{{ k3s_packages }}"
    state: present

- name: Enable and start iscsid
  systemd:
    name: iscsid
    state: started
    enabled: true

# --- Network configuration ---
- name: Load br_netfilter kernel module
  modprobe:
    name: br_netfilter
    state: present
    persistent: present

- name: Set bridge-nf-call-iptables
  sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    sysctl_set: true
    state: present
    reload: true
  with_items:
    - name: net.bridge.bridge-nf-call-iptables
      value: 1
    - name: net.bridge.bridge-nf-call-ip6tables
      value: 1

# Swap is intentionally left enabled; kubelet is configured with
# failSwapOn=false + memorySwap.swapBehavior=LimitedSwap in kubelet.config.j2.
# See incident-2026-04-13-observability-cascade.md for the rationale.
