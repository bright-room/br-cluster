---
- name: Install k3s prerequisite packages
  apt:
    name: "{{ k3s_packages }}"
    state: present

- name: Enable and start iscsid
  systemd:
    name: iscsid
    state: started
    enabled: true

# --- Network configuration ---
- name: Load br_netfilter kernel module
  modprobe:
    name: br_netfilter
    state: present
    persistent: present

- name: Set kernel sysctl for k3s
  sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    sysctl_set: true
    state: present
    reload: true
  with_items:
    - name: net.bridge.bridge-nf-call-iptables
      value: 1
    - name: net.bridge.bridge-nf-call-ip6tables
      value: 1
    # Ubuntu default (128) is too low for a k3s worker; kured-driven reboots
    # can consolidate root-uid pods on a single node and exhaust inotify
    # instances, breaking nats-server-config-reloader / argo-events sensors etc.
    - name: fs.inotify.max_user_instances
      value: 8192
    - name: fs.inotify.max_user_watches
      value: 524288

# Swap is intentionally left enabled; kubelet is configured with
# failSwapOn=false + memorySwap.swapBehavior=LimitedSwap in kubelet.config.j2.
# See incident-2026-04-13-observability-cascade.md for the rationale.
