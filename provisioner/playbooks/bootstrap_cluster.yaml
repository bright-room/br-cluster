---
- name: Bootstrap Kubernetes cluster
  hosts: localhost
  connection: local
  gather_facts: false

  collections:
    - onepassword.connect

  environment:
    KUBECONFIG: "/.secret/config"
    OP_CONNECT_TOKEN: "{{ lookup('env', 'OP_CONNECT_TOKEN') }}"
    OP_CONNECT_HOST: "{{ lookup('env', 'OP_CONNECT_HOST') }}"

  pre_tasks:
    - name: Fetch required secrets
      include_role:
        name: secrets
      vars:
        required_secrets:
          - github_app
          - onepassword_connect
      tags: [always]

  roles:
    - role: bootstrap/verify_nodes
      tags: [verify]

    - role: bootstrap/secrets
      tags: [secrets]

    - role: bootstrap/fluxcd
      tags: [fluxcd]
