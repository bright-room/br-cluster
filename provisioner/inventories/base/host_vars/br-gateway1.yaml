---
##################################
# ipr-cnrs/nftables configuration
##################################
nft_old_pkg_list: []

nft_global_default_rules: {}
nft_global_rules:
  005 state management:
    - ct state established,related accept
    - ct state invalid drop

nft_input_default_rules: {}
nft_input_rules:
  000 policy:
    - type filter hook input priority 0; policy drop;
  001 global:
    - jump global
  002 localhost:
    - iif lo accept
  014 icmp:
    - meta l4proto { icmp ,icmpv6 } accept
  210 input tcp accepted:
    - iifname $lan_interface tcp dport @in_tcp_accept ct state new accept
  211 input udp accepted:
    - iifname $lan_interface udp dport @in_udp_accept ct state new accept
  215 input tcp from k8s pods:
    - ip saddr $pod_cidr tcp dport @in_pod_tcp_accept ct state new accept
  # ssh は CF WARP private network 経路 (br-infra Tunnel) でアクセスする運用に
  # 移行済。WAN 直の ssh は CF/WARP 障害時の家 LAN フォールバック専用とし、
  # source を home_lan_network に制限して外部からの port-scan を遮断する。
  # 詳細: docs/runbooks/cloudflare-tunnel-warp-access.md
  220 input tcp from wan (home lan only):
    - iifname $wan_interface ip saddr $home_lan_network tcp dport @in_wan_tcp_accept_home ct state new accept
  221 input tcp from wan (open):
    - iifname $wan_interface tcp dport @in_wan_tcp_accept_open ct state new accept
  222 input udp from wan:
    - iifname $wan_interface udp dport @in_wan_udp_accept ct state new accept

nft_output_default_rules: {}
nft_output_rules:
  000 policy:
    - type filter hook output priority 0;

nft__forward_table_manage: true
nft_forward_default_rules: {}
nft_forward_rules:
  000 policy:
    - type filter hook forward priority 0; policy drop;
  001 global:
    - jump global
  200 lan to wan tcp:
    - iifname $lan_interface ip saddr $lan_network oifname $wan_interface tcp dport @forward_tcp_accept ct state new accept
  210 lan to wan udp:
    - iifname $lan_interface ip saddr $lan_network oifname $wan_interface udp dport @forward_udp_accept ct state new accept
  # WAN 直経路は CF/WARP 障害時の家 LAN フォールバック専用 (上記 input ルール参照)。
  # forward 段でも source を home_lan_network に絞り、外部から DNAT 経路に到達しないようにする。
  220 ssh from wan (home lan only):
    - iifname $wan_interface ip saddr $home_lan_network oifname $lan_interface ip daddr $lan_network tcp dport ssh ct state new accept
  250 k8s api from wan (home lan only):
    - iifname $wan_interface ip saddr $home_lan_network oifname $lan_interface ip daddr {{ (cluster_vips | selectattr('name', 'equalto', 'k8s-api') | first).ip }} tcp dport 6443 ct state new accept

nft__nat_table_manage: true
nft__nat_default_prerouting_rules: {}
nft__nat_prerouting_rules:
  000 policy:
    - type nat hook prerouting priority -100;
  020 dnat k8s api:
    - iifname $wan_interface tcp dport 6443 dnat ip to {{ (cluster_vips | selectattr('name', 'equalto', 'k8s-api') | first).ip }}:6443

nft__nat_default_postrouting_rules: {}
nft__nat_postrouting_rules:
  000 policy:
    - type nat hook postrouting priority 100;
  005 masquerade lan to wan:
    - ip saddr $lan_network oifname $wan_interface masquerade
  010 masquerade wan to lan (hairpin for dnat):
    - ip saddr $wan_network ip daddr $lan_network oifname $lan_interface masquerade

nft_define_default: {}
nft_define:
  broadcast and multicast:
    name: badcast_addr
    value: "{ 255.255.255.255, 224.0.0.1, 224.0.0.251 }"
  ip6 broadcast and multicast:
    name: ip6_badcast_addr
    value: "{ ff02::16 }"
  input tcp accepted from lan:
    name: in_tcp_accept
    # 9100: prometheus-node-exporter DaemonSet on k3s nodes (hostNetwork)
    # 9101: systemd node_exporter on every node (docs/observability-plan.md P1-A)
    # 12345: systemd Alloy HTTP server (internal /metrics) on every node
    value: "{ ssh, domain, 2379, 9100, 9101, 12345 }"
  input udp accepted from lan:
    name: in_udp_accept
    value: "{ domain, ntp, bootps }"
  # ssh は home_lan_network からのみ accept (フォールバック専用)
  input tcp accepted from wan (home lan only):
    name: in_wan_tcp_accept_home
    value: "{ ssh }"
  # domain (53) は WAN 上の家 LAN クライアントが gateway1 を DNS として参照するため open
  input tcp accepted from wan (open):
    name: in_wan_tcp_accept_open
    value: "{ domain }"
  input udp accepted from wan:
    name: in_wan_udp_accept
    value: "{ domain }"
  lan interface:
    name: lan_interface
    value: "eth0"
  wan interface:
    name: wan_interface
    value: "wlan0"
  lan network:
    name: lan_network
    value: "{{ cluster_network.subnet }}/{{ cluster_network.prefix_length }}"
  wan network:
    name: wan_network
    value: "0.0.0.0/0"
  # 自宅 LAN (br-gateway1 wlan0 が join している家庭用 Wi-Fi の subnet)。
  # WAN 直の ssh / k8s-api 受け入れを家 LAN からのみに制限するため使用。
  home lan network:
    name: home_lan_network
    value: "192.168.2.0/24"
  pod cidr:
    name: pod_cidr
    value: "10.42.0.0/16"
  input tcp accepted from k8s pods:
    name: in_pod_tcp_accept
    value: "{ domain, 2379 }"
  forward tcp accept:
    name: forward_tcp_accept
    # submission (587) is egress SMTP for Zitadel -> Resend.
    value: "{ http, https, domain, 7844, submission }"
  forward udp accept:
    name: forward_udp_accept
    value: "{ domain, ntp, 7844 }"

nft_set_default: {}
nft_set:
  blackhole:
    - type ipv4_addr;
    - elements = $badcast_addr
  ip6blackhole:
    - type ipv6_addr;
    - elements = $ip6_badcast_addr
  in_tcp_accept:
    - type inet_service; flags interval;
    - elements = $in_tcp_accept
  in_udp_accept:
    - type inet_service; flags interval;
    - elements = $in_udp_accept
  in_wan_tcp_accept_home:
    - type inet_service; flags interval;
    - elements = $in_wan_tcp_accept_home
  in_wan_tcp_accept_open:
    - type inet_service; flags interval;
    - elements = $in_wan_tcp_accept_open
  in_wan_udp_accept:
    - type inet_service; flags interval;
    - elements = $in_wan_udp_accept
  in_pod_tcp_accept:
    - type inet_service; flags interval;
    - elements = $in_pod_tcp_accept
  forward_tcp_accept:
    - type inet_service; flags interval;
    - elements = $forward_tcp_accept
  forward_udp_accept:
    - type inet_service; flags interval;
    - elements = $forward_udp_accept
