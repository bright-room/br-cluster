---
##################################
# Storage configuration
# OS ディスクの残り領域を Garage (S3) のデータ置き場として使う
##################################
storage_mode: ext4
mount_point: /storage


##################################
# Let's Encrypt configuration
##################################
lets_encrypt:
  virtual_environment: /lets_encrypt
  certificate_dir: /etc/letsencrypt/live
  deploy_hook_dir: /etc/letsencrypt/renewal-hooks/deploy

##################################
# Garage S3 configuration
##################################
garage:
  data_dir: /storage/garage/data
  meta_dir: /storage/garage/meta
  config_dir: /etc/garage
  ssl_dir: /etc/garage/ssl
  capacity: 1T
  server:
    s3_port: 3900
    rpc_port: 3901
    web_port: 3902
    admin_port: 3903
  operator:
    user: garage
    group: garage
  provisioning:
    region: ap-northeast-1
    buckets:
      - name: loki
      - name: tempo
      - name: argo-workflows
    users:
      - name: loki
        bucket_acl:
          bucket_name: loki
      - name: tempo
        bucket_acl:
          bucket_name: tempo
      # 1Password garage item の field label は <name>_access_key_id 形式。
      # 既存の loki/tempo に合わせ underscore 付きで unique 化するため user.name
      # は argo_workflows (S3 bucket は伝統的に hyphen で命名するので分離)。
      - name: argo_workflows
        bucket_acl:
          bucket_name: argo-workflows
