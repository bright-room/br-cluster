---
environments:
  - dev
  - prod

servers:
  - name: br-gateway1
    type: gateway
  - name: br-db1
    type: standalone
    services:
      - postgresql
      - certbot
  - name: br-storage1
    type: standalone
    services:
      - garage
      - caddy
      - certbot
  - name: br-observability1
    type: standalone
    services: []
  - name: br-ai1
    type: standalone
    services: []
  - name: br-cluster1
    type: node
    k8s_role: primary
  - name: br-cluster2
    type: node
    k8s_role: worker
  - name: br-cluster3
    type: node
    k8s_role: worker
