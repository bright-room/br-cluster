[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cluster-forge"
version = "0.1.0"
description = "Raspberry Pi Kubernetes cluster build & provision tool"
requires-python = ">=3.12"
dependencies = [
    "click>=8.1",
    "passlib>=1.7",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "jinja2>=3.1",
]

[project.scripts]
cluster-forge = "cluster_forge.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["cli/cluster_forge"]

[tool.pytest.ini_options]
testpaths = ["cli/tests"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.11",
    "flux-local",
]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["cluster_forge"]
