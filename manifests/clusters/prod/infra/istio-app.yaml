---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: istio-base-app
  namespace: flux-system
spec:
  interval: 30m
  targetNamespace: istio-system
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: cilium-config
    - name: coredns-app
  path: ./manifests/platform/istio/base/overlays/prod
  prune: true
  wait: true
  timeout: 5m
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: istio-app
  namespace: flux-system
spec:
  interval: 30m
  targetNamespace: istio-system
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: istio-base-app
  path: ./manifests/platform/istio/istiod/overlays/prod
  prune: true
  wait: true
  timeout: 15m
