apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: longhorn-app
  namespace: flux-system
spec:
  interval: 30m
  targetNamespace: longhorn-system
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: csi-external-snapshotter-app
    - name: external-secrets-config
  path: ./manifests/platform/longhorn/app/overlays/prod
  prune: true
  wait: true
  timeout: 15m
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: longhorn-config
  namespace: flux-system
spec:
  interval: 30m
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: longhorn-app
    - name: envoy-gateway-config
  path: ./manifests/platform/longhorn/config/overlays/prod
  prune: true
  timeout: 5m
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-settings
