apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: longhorn-app
  namespace: flux-system
spec:
  interval: 30m
  targetNamespace: longhorn-system
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: csi-external-snapshotter-app
    - name: external-secrets-config
  path: ./platform/longhorn/app/overlays/prod
  prune: true
  wait: true
  timeout: 15m
