apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: onepassword-connect-app
  namespace: flux-system
spec:
  interval: 30m
  targetNamespace: onepassword
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./manifests/platform/onepassword-connect/app/overlays/prod
  prune: true
  wait: true
  timeout: 5m
