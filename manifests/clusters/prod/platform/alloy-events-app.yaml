apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: alloy-events-app
  namespace: flux-system
spec:
  interval: 30m
  targetNamespace: alloy-events
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: loki-app
  path: ./manifests/platform/alloy-events/app/overlays/prod
  prune: true
  timeout: 5m
