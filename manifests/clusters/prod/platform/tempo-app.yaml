apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: tempo-app
  namespace: flux-system
spec:
  interval: 30m
  targetNamespace: tempo
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: external-secrets-config
    - name: longhorn-app
    - name: garage-app
  path: ./manifests/platform/tempo/app/overlays/prod
  prune: true
  wait: true
  timeout: 15m
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-settings
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: tempo-monitoring
  namespace: flux-system
spec:
  interval: 30m
  targetNamespace: tempo
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: tempo-app
    - name: kube-prometheus-stack-app
  path: ./manifests/platform/tempo/monitoring/overlays/prod
  prune: true
