---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: tempo-app
  namespace: flux-system
spec:
  interval: 30m
  targetNamespace: tempo
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: longhorn-app
    - name: external-secrets-config
  path: ./manifests/platform/tempo/app/overlays/prod
  prune: true
  wait: true
  timeout: 15m
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: tempo-monitoring
  namespace: flux-system
spec:
  interval: 30m
  targetNamespace: tempo
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: tempo-app
    - name: kube-prometheus-stack-app
  path: ./manifests/platform/tempo/monitoring/overlays/prod
  prune: true
