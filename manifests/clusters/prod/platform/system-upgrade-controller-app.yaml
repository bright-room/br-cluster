---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: system-upgrade-controller-app
  namespace: flux-system
spec:
  interval: 30m
  targetNamespace: system-upgrade
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./manifests/platform/system-upgrade-controller/app/overlays/prod
  prune: true
  wait: true
  timeout: 5m
