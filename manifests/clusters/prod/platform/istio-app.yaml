---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: istio-base-app
  namespace: flux-system
spec:
  interval: 30m
  targetNamespace: istio-system
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: cilium-config
    - name: coredns-app
  path: ./manifests/platform/istio/base/overlays/prod
  prune: true
  wait: true
  timeout: 5m
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: istio-cni-app
  namespace: flux-system
spec:
  interval: 30m
  targetNamespace: istio-system
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: istio-base-app
  path: ./manifests/platform/istio/cni/overlays/prod
  prune: true
  wait: true
  timeout: 5m
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: istio-istiod-app
  namespace: flux-system
spec:
  interval: 30m
  targetNamespace: istio-system
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: istio-base-app
    - name: istio-cni-app
  path: ./manifests/platform/istio/istiod/overlays/prod
  prune: true
  wait: true
  timeout: 15m
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: istio-ztunnel-app
  namespace: flux-system
spec:
  interval: 30m
  targetNamespace: istio-system
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: istio-base-app
    - name: istio-cni-app
    - name: istio-istiod-app
  path: ./manifests/platform/istio/ztunnel/overlays/prod
  prune: true
  wait: true
  timeout: 5m
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: istio-monitoring
  namespace: flux-system
spec:
  interval: 30m
  targetNamespace: istio-system
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: istio-istiod-app
    - name: kube-prometheus-stack-app
  path: ./manifests/platform/istio/monitoring/overlays/prod
  prune: true
