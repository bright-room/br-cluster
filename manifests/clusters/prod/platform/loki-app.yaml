apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: loki-app
  namespace: flux-system
spec:
  interval: 30m
  targetNamespace: loki
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: longhorn-app
  path: ./manifests/platform/loki/app/overlays/prod
  prune: true
  wait: true
  timeout: 15m
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: loki-monitoring
  namespace: flux-system
spec:
  interval: 30m
  targetNamespace: loki
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: loki-app
    - name: kube-prometheus-stack-app
  path: ./manifests/platform/loki/monitoring/overlays/prod
  prune: true
