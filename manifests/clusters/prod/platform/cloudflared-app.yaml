---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cloudflared-app
  namespace: flux-system
spec:
  interval: 30m
  targetNamespace: cloudflared
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: external-secrets-config
  path: ./manifests/platform/cloudflared/app/overlays/prod
  prune: true
  wait: true
  timeout: 5m
