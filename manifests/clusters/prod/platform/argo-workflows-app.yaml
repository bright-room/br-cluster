---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: argo-workflows-app
  namespace: flux-system
spec:
  interval: 30m
  targetNamespace: argo-workflows
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: platform-pg-cluster
    - name: external-secrets-config
  path: ./manifests/platform/argo-workflows/app/overlays/prod
  prune: true
  wait: true
  timeout: 15m
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: argo-workflows-config
  namespace: flux-system
spec:
  interval: 30m
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: argo-workflows-app
    - name: envoy-gateway-config
  path: ./manifests/platform/argo-workflows/config/overlays/prod
  prune: true
  timeout: 5m
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-settings
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: argo-workflows-samples
  namespace: flux-system
spec:
  interval: 30m
  targetNamespace: argo-workflows
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: argo-workflows-app
  path: ./manifests/platform/argo-workflows/samples/overlays/prod
  prune: true
  timeout: 5m
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: argo-workflows-secrets
  namespace: flux-system
spec:
  interval: 30m
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: argo-workflows-app
    - name: external-secrets-config
  path: ./manifests/platform/argo-workflows/secrets/overlays/prod
  prune: true
  wait: true
  timeout: 5m
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: argo-workflows-notify
  namespace: flux-system
spec:
  interval: 30m
  targetNamespace: argo-workflows
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: argo-workflows-app
    - name: argo-workflows-secrets
  path: ./manifests/platform/argo-workflows/notify/overlays/prod
  prune: true
  timeout: 5m
  postBuild:
    # Sensor manifest の ${DISCORD_WEBHOOK_URL} を flux-system ns に投影
    # された argo-workflows-discord-substitution Secret から apply 時に
    # 埋め込む (cert-manager-substitution と同パターン)。
    substituteFrom:
      - kind: Secret
        name: argo-workflows-discord-substitution
