---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: argo-workflows-app
  namespace: flux-system
spec:
  interval: 30m
  targetNamespace: argo-workflows
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: platform-pg-cluster
    - name: external-secrets-config
  path: ./manifests/platform/argo-workflows/app/overlays/prod
  prune: true
  wait: true
  timeout: 15m
