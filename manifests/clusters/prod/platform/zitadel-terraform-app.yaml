---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: zitadel-terraform
  namespace: flux-system
spec:
  interval: 30m
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: zitadel-app
    - name: envoy-gateway-config
  path: ./manifests/platform/zitadel/terraform/overlays/prod
  prune: true
  wait: true
  timeout: 10m
