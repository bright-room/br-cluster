---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: prometheus-operator-crds
  namespace: flux-system
spec:
  interval: 30m
  targetNamespace: kube-system
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./manifests/platform/kube-prometheus-stack/prometheus-operator-crds/overlays/prod
  prune: true
  wait: true
  timeout: 5m
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kube-prometheus-stack-app
  namespace: flux-system
spec:
  interval: 30m
  targetNamespace: kube-prom-stack
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: prometheus-operator-crds
    - name: external-secrets-config
    - name: longhorn-app
  path: ./manifests/platform/kube-prometheus-stack/app/overlays/prod
  prune: true
  wait: true
  timeout: 15m
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-settings
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kube-prometheus-stack-externalnodes
  namespace: flux-system
spec:
  interval: 30m
  targetNamespace: kube-prom-stack
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: kube-prometheus-stack-app
  path: ./manifests/platform/kube-prometheus-stack/externalnodes-monitoring/overlays/prod
  prune: true
  wait: true
  timeout: 5m
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kube-prometheus-stack-rules
  namespace: flux-system
spec:
  interval: 30m
  targetNamespace: kube-prom-stack
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: kube-prometheus-stack-app
  path: ./manifests/platform/kube-prometheus-stack/rules/overlays/prod
  prune: true
  wait: true
  timeout: 5m
