---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: external-dns-cloudflare-app
  namespace: flux-system
spec:
  interval: 30m
  targetNamespace: external-dns-cloudflare
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: external-secrets-config
  path: ./manifests/platform/external-dns-cloudflare/app/overlays/prod
  prune: true
  timeout: 5m
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-settings
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: external-dns-cloudflare-monitoring
  namespace: flux-system
spec:
  interval: 30m
  targetNamespace: external-dns-cloudflare
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: external-dns-cloudflare-app
    - name: kube-prometheus-stack-app
  path: ./manifests/platform/external-dns-cloudflare/monitoring/overlays/prod
  prune: true
