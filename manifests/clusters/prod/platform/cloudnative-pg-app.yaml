---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cloudnative-pg-app
  namespace: flux-system
spec:
  interval: 30m
  targetNamespace: cnpg-system
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./manifests/platform/cloudnative-pg/app/overlays/prod
  prune: true
  wait: true
  timeout: 5m
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cloudnative-pg-monitoring
  namespace: flux-system
spec:
  interval: 30m
  targetNamespace: cnpg-system
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: cloudnative-pg-app
    - name: kube-prometheus-stack-app
  path: ./manifests/platform/cloudnative-pg/monitoring/overlays/prod
  prune: true
