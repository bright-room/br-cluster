---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: alloy-app
  namespace: flux-system
spec:
  interval: 30m
  targetNamespace: alloy
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: loki-app
    - name: tempo-app
  path: ./manifests/platform/alloy/app/overlays/prod
  prune: true
  wait: true
  timeout: 15m
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: alloy-monitoring
  namespace: flux-system
spec:
  interval: 30m
  targetNamespace: alloy
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: alloy-app
    - name: kube-prometheus-stack-app
  path: ./manifests/platform/alloy/monitoring/overlays/prod
  prune: true
