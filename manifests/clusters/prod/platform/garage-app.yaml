apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: garage-app
  namespace: flux-system
spec:
  interval: 30m
  targetNamespace: garage
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: external-secrets-config
    - name: longhorn-app
    - name: istio-ztunnel-app
  path: ./manifests/platform/garage/app/overlays/prod
  prune: true
  wait: true
  timeout: 15m
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-settings
