---
# 受け入れ基準 2 (外部トリガ) のリファレンス。
# webhook EventSource は events-controller が Pod を起こして HTTP server
# を立てる。EventBus default 経由で Sensor に流れる。
#
# Phase 1 では外部公開 (CF Tunnel) しない。クラスタ内 curl で検証:
#   kubectl run -n argo-workflows curl --rm -it --image=curlimages/curl \
#     -- curl -sS -X POST -H 'Content-Type: application/json' \
#     -d '{"message":"hello from curl"}' \
#     http://sample-webhook-eventsource-svc:12000/sample
apiVersion: argoproj.io/v1alpha1
kind: EventSource
metadata:
  name: sample-webhook
spec:
  service:
    ports:
      - port: 12000
        targetPort: 12000
  webhook:
    sample:
      port: "12000"
      endpoint: /sample
      method: POST
