---
# Sensor が Workflow を create するための ServiceAccount + Role。
# argo-events は Sensor 単位に SA を指定させる設計 (default SA は無権限)。
# Step 6 の Discord 通知 Sensor も別途独自 SA を持つ予定 (権限分離)。
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sample-webhook-sensor
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sample-webhook-sensor
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["workflows", "workflowtemplates"]
    verbs: ["get", "list", "watch", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sample-webhook-sensor
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: sample-webhook-sensor
subjects:
  - kind: ServiceAccount
    name: sample-webhook-sensor
