---
# Workflow status.phase が Succeeded / Failed / Error に遷移したら
# notify-discord WorkflowTemplate を起動する Sensor。
#
# k8s create Workflow trigger に切り替えたことで、Sensor 自身は権限の
# 軽い (workflows create のみ) Pod に留まり、curl + JSON 整形は
# WorkflowTemplate 側に集約される。Discord embed の integer color や
# 多フィールド構成も自由に書ける。
#
# 再帰トリガ防止: notify.b8m.app/skip: "true" ラベル付き Workflow の
# 除外は EventSource (notify-workflow) 側の labelSelector で実施する
# (Sensor の data/expr filter は両方とも path 不在で event 全体を
# discard する仕様のため、このレイヤでは扱えない)。
apiVersion: argoproj.io/v1alpha1
kind: Sensor
metadata:
  name: notify-discord
spec:
  template:
    serviceAccountName: notify-sensor-discord
  dependencies:
    - name: workflow-succeeded
      eventSourceName: notify-workflow
      eventName: workflows
      filters:
        data:
          - path: body.status.phase
            type: string
            value:
              - Succeeded
    - name: workflow-failed
      eventSourceName: notify-workflow
      eventName: workflows
      filters:
        data:
          - path: body.status.phase
            type: string
            value:
              - Failed
              - Error
  triggers:
    - template:
        name: discord-succeeded
        conditions: workflow-succeeded
        k8s:
          operation: create
          source:
            resource:
              apiVersion: argoproj.io/v1alpha1
              kind: Workflow
              metadata:
                generateName: notify-discord-
                labels:
                  notify.b8m.app/skip: "true"
              spec:
                workflowTemplateRef:
                  name: notify-discord
                arguments:
                  parameters:
                    - name: workflow-name
                      value: ""
                    - name: workflow-namespace
                      value: ""
                    - name: phase
                      value: ""
                    - name: started-at
                      value: ""
                    - name: finished-at
                      value: ""
                    - name: progress
                      value: ""
                    - name: message
                      value: ""
          parameters:
            - src:
                dependencyName: workflow-succeeded
                dataKey: body.metadata.name
              dest: spec.arguments.parameters.0.value
            - src:
                dependencyName: workflow-succeeded
                dataKey: body.metadata.namespace
              dest: spec.arguments.parameters.1.value
            - src:
                dependencyName: workflow-succeeded
                dataKey: body.status.phase
              dest: spec.arguments.parameters.2.value
            - src:
                dependencyName: workflow-succeeded
                dataKey: body.status.startedAt
              dest: spec.arguments.parameters.3.value
            - src:
                dependencyName: workflow-succeeded
                dataKey: body.status.finishedAt
              dest: spec.arguments.parameters.4.value
            - src:
                dependencyName: workflow-succeeded
                dataKey: body.status.progress
              dest: spec.arguments.parameters.5.value
    - template:
        name: discord-failed
        conditions: workflow-failed
        k8s:
          operation: create
          source:
            resource:
              apiVersion: argoproj.io/v1alpha1
              kind: Workflow
              metadata:
                generateName: notify-discord-
                labels:
                  notify.b8m.app/skip: "true"
              spec:
                workflowTemplateRef:
                  name: notify-discord
                arguments:
                  parameters:
                    - name: workflow-name
                      value: ""
                    - name: workflow-namespace
                      value: ""
                    - name: phase
                      value: ""
                    - name: started-at
                      value: ""
                    - name: finished-at
                      value: ""
                    - name: progress
                      value: ""
                    - name: message
                      value: ""
          parameters:
            - src:
                dependencyName: workflow-failed
                dataKey: body.metadata.name
              dest: spec.arguments.parameters.0.value
            - src:
                dependencyName: workflow-failed
                dataKey: body.metadata.namespace
              dest: spec.arguments.parameters.1.value
            - src:
                dependencyName: workflow-failed
                dataKey: body.status.phase
              dest: spec.arguments.parameters.2.value
            - src:
                dependencyName: workflow-failed
                dataKey: body.status.startedAt
              dest: spec.arguments.parameters.3.value
            - src:
                dependencyName: workflow-failed
                dataKey: body.status.finishedAt
              dest: spec.arguments.parameters.4.value
            - src:
                dependencyName: workflow-failed
                dataKey: body.status.progress
              dest: spec.arguments.parameters.5.value
            - src:
                dependencyName: workflow-failed
                dataKey: body.status.message
              dest: spec.arguments.parameters.6.value
