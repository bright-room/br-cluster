---
# notify-discord WorkflowTemplate が起動する curl Pod の env として
# 読まれる。Workflow trigger 化したことで in-cluster Sensor manifest
# には webhook URL が露出しなくなり (HTTP trigger 時は postBuild で
# Sensor リソースに焼き込んでいた)、ExternalSecret + Pod env の
# 通常パターンに戻った。
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argo-workflows-discord
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword-backend
    kind: ClusterSecretStore
  target:
    name: argo-workflows-discord
  data:
    - secretKey: webhook_url
      remoteRef:
        key: argo-workflows
        property: discord_webhook_url
