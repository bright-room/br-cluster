---
# resource EventSource は kube-apiserver を watch するため独自 SA + Role が
# 必要 (argo-events controller が立てる events-source pod に attach される)。
apiVersion: v1
kind: ServiceAccount
metadata:
  name: notify-eventsource
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: notify-eventsource
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["workflows"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: notify-eventsource
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: notify-eventsource
subjects:
  - kind: ServiceAccount
    name: notify-eventsource
---
# Discord 通知 Sensor は notify-discord WorkflowTemplate を起動する
# k8s create Workflow trigger を持つので Workflow create 権限が必要。
apiVersion: v1
kind: ServiceAccount
metadata:
  name: notify-sensor-discord
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: notify-sensor-discord
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["workflows", "workflowtemplates"]
    verbs: ["get", "list", "watch", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: notify-sensor-discord
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: notify-sensor-discord
subjects:
  - kind: ServiceAccount
    name: notify-sensor-discord
