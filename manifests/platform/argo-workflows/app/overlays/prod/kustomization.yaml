---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: argo-workflows

resources:
  - ../../base

configMapGenerator:
  - name: argo-workflows-helm-values
    behavior: merge
    files:
      - overlay-values.yaml=values-workflows.yaml

patches:
  - target:
      group: helm.toolkit.fluxcd.io
      kind: HelmRelease
      name: argo-workflows
    path: helm-patch-workflows.yaml
