---
# argo-events helm values (base)
#
# Phase 1 step 1: controller / webhook のみ起動。
# EventSource / Sensor / EventBus は Step 5 / 6 で別 manifest として投入。

# events-controller の resource は overlay で上書き。
configs:
  jetstream:
    # JetStream EventBus を使う場合のデフォルト。Phase 1 では NATS を採用しない
    # (Pi リソース節約のため EventSource → Sensor 直結 + JetStream EventBus は
    # 必要時に別途検討)。Step 5 着手時に EventBus 種別を再判断する。
    versions:
      - version: 2.10.10
        natsImage: nats:2.10.10-scratch
        configReloaderImage: natsio/nats-server-config-reloader:0.14.0
        startCommand: /nats-server
