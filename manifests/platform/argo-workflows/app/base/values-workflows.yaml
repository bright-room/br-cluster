---
# argo-workflows helm values (base)
#
# Phase 1 step 1: 最小構成で controller + server を起動するだけ。
# - workflow archive (PG) は Step 2 で有効化
# - artifact repository (Garage S3) は Step 3 で有効化
# - UI 公開 + Zitadel SSO は Step 4 で有効化
#
# UI / SSO 未設定の間は server を立てつつ認証なしで kubectl port-forward 経由
# でのみアクセスする想定。

singleNamespace: false

controller:
  # Pi リソース圧迫を抑えるため parallelism を絞る (proposal §C)。
  parallelism: 6
  workflowDefaults:
    spec:
      ttlStrategy:
        secondsAfterCompletion: 86400
        secondsAfterSuccess: 86400
        secondsAfterFailure: 259200
      podGC:
        strategy: OnWorkflowSuccess
      activeDeadlineSeconds: 7200

  # Workflow 履歴は etcd ではなく platform-pg (CNPG) に逃がす。
  # ttlStrategy で k8s 上の Workflow CR は短命にする一方、archive 経由で
  # UI から長期履歴を参照できる。
  persistence:
    archive: true
    archiveTTL: 30d
    postgresql:
      host: platform-pg-rw.platform-pg.svc.cluster.local
      port: 5432
      database: argo_workflows
      tableName: argo_workflows
      userNameSecret:
        name: argo-workflows-archive-db
        key: username
      passwordSecret:
        name: argo-workflows-archive-db
        key: password

# Workflow 内で生成した artifact / log を Garage S3 に逃がす。
# Loki / Tempo と同じバックエンドだが user / bucket は分離 (proposal §採用表)。
artifactRepository:
  archiveLogs: true
  s3:
    bucket: argo-workflows
    endpoint: object-storage.cluster-internal.bright-room.net:3900
    region: ap-northeast-1
    insecure: false
    keyFormat: "{{workflow.namespace}}/{{workflow.name}}/{{pod.name}}"
    accessKeySecret:
      name: argo-workflows-artifact-s3-secret
      key: accessKey
    secretKeySecret:
      name: argo-workflows-artifact-s3-secret
      key: secretKey

server:
  # UI は HTTPRoute (config/) で出すので LB は使わない。
  serviceType: ClusterIP
  baseHref: /
  # Envoy Gateway で TLS termination するので argo-server 自体は plain HTTP。
  # 自己署名 TLS を内部経路で挟む意味はない。
  secure: false
  extraArgs:
    - --auth-mode=sso

  # Zitadel OIDC で argo-server に直接 SSO。Envoy SecurityPolicy には
  # 乗せない (Grafana と同型 / 二重ダンス回避)。CF Access が外側で
  # GitHub org + WARP を要求する。
  #
  # Phase 1 は単一オペレーター運用なので RBAC を有効化せず、
  # SSO 認証された全ユーザに argo-server の admin 権限を付与する。
  # 将来人が増えたら sso.rbac.enabled: true + ServiceAccount で
  # group → role mapping を切る。
  sso:
    issuer: https://auth.b8m.app
    clientId:
      name: argo-workflows-sso
      key: client-id
    clientSecret:
      name: argo-workflows-sso
      key: client-secret
    redirectUrl: https://argo-workflows.b8m.app/oauth2/callback
    scopes:
      - openid
      - profile
      - email
    sessionExpiry: 24h
