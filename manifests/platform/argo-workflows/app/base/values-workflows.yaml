---
# argo-workflows helm values (base)
#
# Phase 1 step 1: 最小構成で controller + server を起動するだけ。
# - workflow archive (PG) は Step 2 で有効化
# - artifact repository (Garage S3) は Step 3 で有効化
# - UI 公開 + Zitadel SSO は Step 4 で有効化
#
# UI / SSO 未設定の間は server を立てつつ認証なしで kubectl port-forward 経由
# でのみアクセスする想定。

singleNamespace: false

# 投入された Workflow Pod が使う SA + RBAC。chart default は
# serviceAccount.create: false なので argo-workflow SA が存在せず、
# rbac.create が SA-less の RoleBinding を作って意味をなさなかった。
# artifactGC は S3 artifactRepository (Garage) を有効にしているので必須。
workflow:
  serviceAccount:
    create: true
    name: argo-workflow
  rbac:
    create: true
    artifactGC: true

controller:
  # Pi リソース圧迫を抑えるため parallelism を絞る (proposal §C)。
  parallelism: 6
  workflowDefaults:
    spec:
      # 投入時に未指定なら argo-workflow SA を使う。chart の workflow.rbac
      # が workflowtaskresults / pods/log 等への権限をこの SA に割り当てる。
      # default SA は無権限なので明示しないと wait コンテナが
      # "workflowtaskresults ... is forbidden" で死ぬ。
      serviceAccountName: argo-workflow
      ttlStrategy:
        secondsAfterCompletion: 86400
        secondsAfterSuccess: 86400
        secondsAfterFailure: 259200
      podGC:
        strategy: OnWorkflowSuccess
      activeDeadlineSeconds: 7200
      # Argo Events の Sensor を撤去したため、全 Workflow への Discord 通知は
      # workflowDefaults の exit hook で一括適用する。
      # spec.onExit は同一 Workflow 内の template 名しか取れず WorkflowTemplate を
      # 参照できないため、LifecycleHook (spec.hooks) の templateRef を使う。
      # Sensor が EventSource のペイロードから埋めていた 7 パラメータは、
      # ここでは Argo の workflow 変数から埋める。
      hooks:
        exit:
          expression: "true"
          templateRef:
            name: notify-discord
            template: post
          arguments:
            parameters:
              - name: workflow-name
                value: "{{workflow.name}}"
              - name: workflow-namespace
                value: "{{workflow.namespace}}"
              - name: phase
                value: "{{workflow.status}}"
              - name: started-at
                value: "{{workflow.creationTimestamp}}"
              - name: finished-at
                value: "{{workflow.duration}}"
              - name: progress
                value: "{{workflow.parameters}}"
              - name: message
                value: "{{workflow.failures}}"

  # Workflow 履歴は etcd ではなく br-db1 の PostgreSQL に逃がす。
  # ttlStrategy で k8s 上の Workflow CR は短命にする一方、archive 経由で
  # UI から長期履歴を参照できる。
  persistence:
    archive: true
    archiveTTL: 30d
    postgresql:
      host: rdbms.prod.internal-service.bright-room.net
      port: 5432
      database: argo_workflows
      tableName: argo_workflows
      # br-db1 の pg_hba.conf は hostssl のみ許可。driver default (prefer) でも
      # 実際は TLS で繋がるが、Zitadel (SSL.Mode: require) と揃えて明示する。
      ssl: true
      sslMode: require
      userNameSecret:
        name: argo-workflows-archive-db
        key: username
      passwordSecret:
        name: argo-workflows-archive-db
        key: password

# Workflow 内で生成した artifact / log を Garage S3 に逃がす。
# Loki / Tempo は撤去済みで、argo-workflows がこのバケットの唯一の利用者。
artifactRepository:
  archiveLogs: true
  s3:
    bucket: argo-workflows
    endpoint: object-storage.prod.internal-service.bright-room.net:3900
    region: ap-northeast-1
    insecure: false
    keyFormat: "{{workflow.namespace}}/{{workflow.name}}/{{pod.name}}"
    accessKeySecret:
      name: argo-workflows-artifact-s3-secret
      key: accessKey
    secretKeySecret:
      name: argo-workflows-artifact-s3-secret
      key: secretKey

server:
  # UI は HTTPRoute (config/) で出すので LB は使わない。
  serviceType: ClusterIP
  baseHref: /
  # Envoy Gateway で TLS termination するので argo-server 自体は plain HTTP。
  # 自己署名 TLS を内部経路で挟む意味はない。
  secure: false
  extraArgs:
    - --auth-mode=sso

  # Zitadel OIDC で argo-server に直接 SSO。Envoy SecurityPolicy には
  # 乗せない (Grafana と同型 / 二重ダンス回避)。CF Access が外側で
  # GitHub org + WARP を要求する。
  #
  # sso.rbac.enabled + customGroupClaimName: roles で Zitadel の roles claim を
  # groups 扱いし、rbac-sso.yaml の ServiceAccount (rbac-rule annotation) に
  # ロールをマップする。
  sso:
    # chart の default は enabled: false でこの block 自体が CM に出ない。
    # --auth-mode=sso だけ立てると "issuer empty" で argo-server crash。
    enabled: true
    issuer: https://auth.b8m.app
    clientId:
      name: argo-workflows-sso
      key: client-id
    clientSecret:
      name: argo-workflows-sso
      key: client-secret
    redirectUrl: https://argo-workflows.b8m.app/oauth2/callback
    scopes:
      - openid
      - profile
      - email
    sessionExpiry: 24h
    # roles claim を argo の "groups" として読み、rbac-rule で SA にマップ。
    customGroupClaimName: roles
    rbac:
      enabled: true
