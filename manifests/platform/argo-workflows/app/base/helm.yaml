---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: argo
spec:
  interval: 30m
  url: https://argoproj.github.io/argo-helm
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: argo-workflows
spec:
  interval: 30m
  chart:
    spec:
      chart: argo-workflows
      version: 1.1.1
      sourceRef:
        kind: HelmRepository
        name: argo
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  valuesFrom:
    - kind: ConfigMap
      name: argo-workflows-helm-values
      valuesKey: base-values.yaml
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: argo-events
spec:
  interval: 30m
  chart:
    spec:
      chart: argo-events
      version: 2.4.21
      sourceRef:
        kind: HelmRepository
        name: argo
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  valuesFrom:
    - kind: ConfigMap
      name: argo-events-helm-values
      valuesKey: base-values.yaml
