---
# Zitadel role → argo ServiceAccount マッピング（SSO RBAC）。
# rbac-rule は argo が customGroupClaimName(roles) を groups として評価する。
# precedence が高い（数字が大きい）ルールが優先。
apiVersion: v1
kind: ServiceAccount
metadata:
  name: argo-admin
  namespace: argo-workflows
  annotations:
    workflows.argoproj.io/rbac-rule: "'admin' in groups"
    workflows.argoproj.io/rbac-rule-precedence: "3"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: argo-edit
  namespace: argo-workflows
  annotations:
    workflows.argoproj.io/rbac-rule: "'maintainer' in groups || 'developer' in groups"
    workflows.argoproj.io/rbac-rule-precedence: "2"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: argo-view
  namespace: argo-workflows
  annotations:
    workflows.argoproj.io/rbac-rule: "'viewer' in groups"
    workflows.argoproj.io/rbac-rule-precedence: "1"
---
# argo-server はクラスタスコープ（argo-workflows-server が ClusterRoleBinding /
# --managed-namespace 無し）で全 namespace の workflow をリストする。よって SSO
# SA の権限も ClusterRoleBinding でクラスタ全体に効かせる必要がある（namespace
# 限定の RoleBinding だと namespace "" のリストが Permission denied になる）。
# admin: workflow の full 管理
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: argo-sso-admin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: argo-workflows-admin
subjects:
  - kind: ServiceAccount
    name: argo-admin
    namespace: argo-workflows
---
# edit: workflow の submit/編集
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: argo-sso-edit
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: argo-workflows-edit
subjects:
  - kind: ServiceAccount
    name: argo-edit
    namespace: argo-workflows
---
# view: 読み取り専用
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: argo-sso-view
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: argo-workflows-view
subjects:
  - kind: ServiceAccount
    name: argo-view
    namespace: argo-workflows
---
# k8s 1.24+ は SA のトークン secret を自動生成しないため、argo の SSO RBAC が
# 期待する `<sa>.service-account-token` を明示的に作る。argo-server は選定した
# SA のこの secret からトークンを取り出して API 呼び出しを代行する。無いと
# "failed to get service account secret" → PERMISSION_DENIED になる。
# data は空のまま（token controller が populate する）なので平文 Secret 禁止
# policy には抵触しない。
apiVersion: v1
kind: Secret
metadata:
  name: argo-admin.service-account-token
  namespace: argo-workflows
  annotations:
    kubernetes.io/service-account.name: argo-admin
type: kubernetes.io/service-account-token
---
apiVersion: v1
kind: Secret
metadata:
  name: argo-edit.service-account-token
  namespace: argo-workflows
  annotations:
    kubernetes.io/service-account.name: argo-edit
type: kubernetes.io/service-account-token
---
apiVersion: v1
kind: Secret
metadata:
  name: argo-view.service-account-token
  namespace: argo-workflows
  annotations:
    kubernetes.io/service-account.name: argo-view
type: kubernetes.io/service-account-token
