---
# tofu-controller の writeOutputsToSecret が zitadel ns に書き出した
# tf-zitadel-output Secret の argo_workflows_client_id / argo_workflows_client_secret
# を、argo-server が SSO config から参照する形に bridge する。
# kubernetes-backend ClusterSecretStore は cross-namespace の Secret 参照を
# 許可する (Grafana の externalsecret-oidc.yaml と同パターン)。
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argo-workflows-sso
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: kubernetes-backend
    kind: ClusterSecretStore
  target:
    name: argo-workflows-sso
    template:
      data:
        client-id: "{{ .client_id }}"
        client-secret: "{{ .client_secret }}"
  data:
    - secretKey: client_id
      remoteRef:
        key: tf-zitadel-output
        property: argo_workflows_client_id
    - secretKey: client_secret
      remoteRef:
        key: tf-zitadel-output
        property: argo_workflows_client_secret
