---
# argo-workflows controller が workflow archive 接続に使う credential。
# 同じ 1Password item (br-cluster-prod / argo-workflows) を platform-pg ns 側
# (managed.roles の passwordSecret) と二重に参照する。username はリテラル。
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argo-workflows-archive-db
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword-backend
    kind: ClusterSecretStore
  target:
    name: argo-workflows-archive-db
    template:
      type: Opaque
      data:
        username: argo_workflows
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: argo-workflows
        property: db_password
