---
# argo-workflows controller が workflow archive 接続に使う credential。
# br-db1 の PostgreSQL ロールを作る Ansible の postgresql role と同じ
# 1Password アイテム (postgresql) を参照する。username はリテラル。
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argo-workflows-archive-db
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword-backend
    kind: ClusterSecretStore
  target:
    name: argo-workflows-archive-db
    template:
      type: Opaque
      data:
        username: argo_workflows
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: postgresql
        property: argo_workflows_password
