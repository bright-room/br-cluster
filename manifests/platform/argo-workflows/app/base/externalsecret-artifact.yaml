---
# Argo Workflows artifact repository (Garage S3) credentials.
# 1Password garage item / section argo-workflows / underscore-prefixed labels
# は loki / tempo と同じ規約 (fetch_garage_operators.yaml 参照)。
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argo-workflows-artifact-s3
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword-backend
    kind: ClusterSecretStore
  target:
    name: argo-workflows-artifact-s3-secret
  data:
    - secretKey: accessKey
      remoteRef:
        key: garage
        property: argo_workflows_access_key_id
    - secretKey: secretKey
      remoteRef:
        key: garage
        property: argo_workflows_secret_access_key
