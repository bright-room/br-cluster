---
# argo-events の Sensor / EventSource は EventBus 経由で疎結合される。
# JetStream モードを採用 (NATS Streaming は deprecated)。version は
# argo-events helm の jetstream config と揃える (values-events.yaml)。
#
# replica: 3 で worker pool に分散。Pi 8GB の各 worker に 1Gi PVC が乗る。
apiVersion: argoproj.io/v1alpha1
kind: EventBus
metadata:
  name: default
spec:
  jetstream:
    version: "2.10.10"
    replicas: 3
    persistence:
      storageClassName: longhorn
      accessMode: ReadWriteOnce
      volumeSize: 1Gi
