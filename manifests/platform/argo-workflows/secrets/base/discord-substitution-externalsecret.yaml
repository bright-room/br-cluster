---
# 1Password br-cluster-prod / argo-workflows item の discord_webhook_url を
# flux-system ns の Secret に投影する。argo-events HTTP trigger の url は
# Secret 直接参照できないため、Flux Kustomization の postBuild.substituteFrom
# でこの Secret を読み、Sensor manifest の ${DISCORD_WEBHOOK_URL} を apply
# 時に埋め込む方式 (cert-manager-substitution と同パターン)。
#
# Flux postBuild.substituteFrom は Kustomization が居る ns (= flux-system)
# でしか Secret を引かないため、この ExternalSecret は flux-system ns に
# 置く必要がある。
#
# 結果として in-cluster の Sensor オブジェクトには webhook URL が平文で
# 入る。クラスタ admin しか Sensor を読めない前提 + Discord webhook は
# 漏洩しても再発行できる軽い credential なので許容範囲。
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argo-workflows-discord-substitution
  namespace: flux-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword-backend
    kind: ClusterSecretStore
  target:
    name: argo-workflows-discord-substitution
    template:
      data:
        # Flux substituteFrom は Secret.data の key 名をそのまま変数名として
        # 使う。postBuild で ${DISCORD_WEBHOOK_URL} が置換される。
        DISCORD_WEBHOOK_URL: "{{ .webhook_url }}"
  data:
    - secretKey: webhook_url
      remoteRef:
        key: argo-workflows
        property: discord_webhook_url
