---
# external-dns helm values (base) — CoreDNS/etcd (SkyDNS schema) provider
#
# Writes A/CNAME records into the etcd instance that br-gateway1's CoreDNS
# reads from (the `etcd` plugin in provisioner/roles/gateway/templates/Corefile.j2).
# This is the DNS path for the internal-gateway (Envoy Gateway, LAN-only VIP)
# so internal services can be addressed as *.cluster-internal.bright-room.net
# from nodes that sit outside the k8s cluster (br-gateway1, br-external1).
#
# The coredns provider is community-maintained "alpha" in external-dns; the
# wire protocol (SkyDNS JSON under /skydns/...) has been stable for years and
# CoreDNS's etcd plugin is the consumer, so the risk is limited to provider
# removal in a future external-dns major. If that happens, replace with a
# direct SkyDNS/etcd controller — the etcd backend itself is not going away.

provider:
  name: coredns

image:
  tag: v0.21.0

sources:
  - gateway-httproute

domainFilters:
  - cluster-internal.bright-room.net

# upsert-only until we've validated records are written and consumed correctly.
# Flip to sync after the first internal service has been through a recreate cycle.
policy: upsert-only

# Distinct owner ID so the TXT registry never collides with the Cloudflare
# external-dns instance (txtOwnerId: br-cluster-prod).
txtOwnerId: br-cluster-prod-internal
registry: txt

# etcd auth: the br-gateway1 etcd listens on HTTP bare with no auth (see
# provisioner/roles/gateway/templates/etcd.service.j2). Pod CIDR is allowed
# to reach :2379 via nftables in_pod_tcp_accept.
env:
  - name: ETCD_URLS
    value: ${COREDNS_ETCD_URL}

# Raspberry Pi kube-apiserver gets throttled at the default client QPS when
# informers have to list-watch many Gateway API resources at startup. Mirror
# the tuning we use for external-dns-cloudflare.
extraArgs:
  - --kube-api-qps=50
  - --kube-api-burst=100
