apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tempo-s3-credentials
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-backend
  target:
    name: tempo-s3-credentials
    creationPolicy: Owner
  data:
    - secretKey: access_key_id
      remoteRef:
        key: garage-cluster-credentials
        property: tempo_access_key_id
    - secretKey: secret_access_key
      remoteRef:
        key: garage-cluster-credentials
        property: tempo_secret_access_key
