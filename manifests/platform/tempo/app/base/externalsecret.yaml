apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tempo-s3
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword-backend
    kind: ClusterSecretStore
  target:
    name: tempo-s3-secret
  data:
    - secretKey: S3_ACCESS_KEY_ID
      remoteRef:
        key: garage
        property: tempo.access_key_id
    - secretKey: S3_SECRET_ACCESS_KEY
      remoteRef:
        key: garage
        property: tempo.secret_access_key
