apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tempo-s3
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword-backend
    kind: ClusterSecretStore
  target:
    name: tempo-s3-secret
  data:
    # external-secrets の onepassword-connect provider は section 参照を
    # サポートしていない (label フラット検索) ため、garage item の top-level
    # に loki_/tempo_ プレフィクス付きのフィールドを別途用意して参照する。
    # section 側 (loki / tempo) は ansible garage_keys task が使う。
    - secretKey: S3_ACCESS_KEY_ID
      remoteRef:
        key: garage
        property: tempo_access_key_id
    - secretKey: S3_SECRET_ACCESS_KEY
      remoteRef:
        key: garage
        property: tempo_secret_access_key
