---
# tempo helm values (base, grafana/tempo single-binary chart)
#
# Single-binary backed by Garage (S3-compatible) on br-external1.
# Longhorn PVC kept only as a 1Gi WAL buffer — blocks live in S3.
# See implementation-plan-v2026.04.md §Phase 2.

tempo:
  reportingEnabled: false
  memBallastSizeMbs: 256

  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

  storage:
    trace:
      backend: s3
      wal:
        path: /var/tempo/wal
      s3:
        bucket: tempo
        endpoint: object-storage.cluster-internal.bright-room.net:3900
        region: ap-northeast-1
        access_key: ${S3_ACCESS_KEY_ID}
        secret_key: ${S3_SECRET_ACCESS_KEY}
        insecure: false
        forcepathstyle: true

  # tempo chart の templates/statefulset.yaml は extraArgs を
  # `range $key, $value` で舐めるため map 形式で書く必要がある
  # (list だと --0=... のようなゴミ flag が生成されて tempo が crash する)。
  extraArgs:
    config.expand-env: "true"
  extraEnv:
    - name: S3_ACCESS_KEY_ID
      valueFrom:
        secretKeyRef:
          name: tempo-s3-secret
          key: S3_ACCESS_KEY_ID
    - name: S3_SECRET_ACCESS_KEY
      valueFrom:
        secretKeyRef:
          name: tempo-s3-secret
          key: S3_SECRET_ACCESS_KEY

persistence:
  enabled: true
  accessModes:
    - ReadWriteOnce
  size: 1Gi
  storageClassName: longhorn

service:
  type: ClusterIP

serviceMonitor:
  enabled: false
