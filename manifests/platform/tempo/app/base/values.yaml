# tempo helm values (base, grafana/tempo single-binary chart)
#
# Local filesystem storage on a Longhorn PVC. This homelab does not
# need object storage for traces.

tempo:
  reportingEnabled: false
  memBallastSizeMbs: 256

  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

  storage:
    trace:
      backend: local
      wal:
        path: /var/tempo/wal
      local:
        path: /var/tempo/blocks

persistence:
  enabled: true
  accessModes:
    - ReadWriteOnce
  size: 10Gi
  storageClassName: longhorn

service:
  type: ClusterIP

serviceMonitor:
  enabled: false
