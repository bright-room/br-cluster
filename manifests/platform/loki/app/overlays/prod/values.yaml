---
# loki helm values (prod overlay)
#
# Pin SingleBinary + gateway to workers (Pi 4GB) with modest limits.
# See incident-2026-04-13-observability-cascade.md.

singleBinary:
  nodeSelector:
    node_type: worker
  resources:
    requests:
      cpu: 200m
      memory: 384Mi
    limits:
      cpu: 1000m
      memory: 768Mi

gateway:
  nodeSelector:
    node_type: worker
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi
