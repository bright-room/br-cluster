# loki helm values (base)

deploymentMode: SimpleScalable

loki:
  auth_enabled: false

  limits_config:
    allow_structured_metadata: true
    max_query_lookback: 168h
    retention_period: 168h
    otlp_config:
      resource_attributes:
        ignore_defaults: true
        attributes_config:
          - action: index_label
            attributes:
              - service.name
              - service.namespace
              - k8s.namespace.name

  compactor:
    compaction_interval: 10m
    delete_request_store: s3
    retention_delete_delay: 2h
    retention_enabled: true
    working_directory: /var/loki/retention

  storage:
    bucketNames:
      chunks: k3s-loki
      ruler: k3s-loki
    type: s3
    s3:
      endpoint: ${CLUSTER_S3_SERVER}:${CLUSTER_S3_PORT}
      region: ap-northeast-1
      s3ForcePathStyle: true
      insecure: true

  schemaConfig:
    configs:
      - from: 2024-04-01
        store: tsdb
        index:
          prefix: loki_index_
          period: 24h
        object_store: s3
        schema: v13

write:
  replicas: 1
  persistence:
    size: 1Gi
    storageClass: longhorn

read:
  replicas: 1
  persistence:
    size: 1Gi
    storageClass: longhorn

backend:
  replicas: 2
  persistence:
    size: 1Gi
    storageClass: longhorn

gateway:
  enabled: true
  replicas: 1
  nginxConfig:
    resolver: coredns.kube-system.svc.cluster.local.

chunksCache:
  enabled: false

resultsCache:
  enabled: false

minio:
  enabled: false

lokiCanary:
  enabled: false

monitoring:
  selfMonitoring:
    enabled: false
    grafanaAgent:
      installOperator: false

test:
  enabled: false
