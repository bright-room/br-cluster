# loki helm values (base)
#
# SingleBinary deployment backed by Garage (S3-compatible) on br-external1.
# Longhorn PVC is kept only as a 1Gi WAL buffer — chunks/index/ruler live in S3.
# See implementation-plan-v2026.04.md §Phase 2.

deploymentMode: SingleBinary

loki:
  auth_enabled: false

  commonConfig:
    replication_factor: 1

  schemaConfig:
    configs:
      - from: 2024-04-01
        store: tsdb
        index:
          prefix: loki_index_
          period: 24h
        object_store: s3
        schema: v13

  storage:
    type: s3
    bucketNames:
      chunks: loki
      ruler: loki
    s3:
      endpoint: https://object-storage.cluster-internal.bright-room.net:3900
      region: ap-northeast-1
      # $$ でエスケープして Flux postBuild substitution を回避。
      # Loki プロセス自身が -config.expand-env=true で env から展開する
      # ランタイム用プレースホルダなので Flux に触らせない。
      accessKeyId: $${S3_ACCESS_KEY_ID}
      secretAccessKey: $${S3_SECRET_ACCESS_KEY}
      s3ForcePathStyle: true
      insecure: false
      http_config:
        idle_conn_timeout: 90s
        response_header_timeout: 0s
        insecure_skip_verify: false

  limits_config:
    allow_structured_metadata: true
    max_query_lookback: 168h
    retention_period: 168h
    otlp_config:
      resource_attributes:
        ignore_defaults: true
        attributes_config:
          - action: index_label
            attributes:
              - service.name
              - service.namespace
              - k8s.namespace.name

  compactor:
    compaction_interval: 10m
    delete_request_store: s3
    retention_delete_delay: 2h
    retention_enabled: true
    working_directory: /var/loki/retention

singleBinary:
  replicas: 1
  persistence:
    enabled: true
    size: 1Gi
    storageClass: longhorn
  extraArgs:
    - '-config.expand-env=true'
  extraEnv:
    - name: S3_ACCESS_KEY_ID
      valueFrom:
        secretKeyRef:
          name: loki-s3-secret
          key: S3_ACCESS_KEY_ID
    - name: S3_SECRET_ACCESS_KEY
      valueFrom:
        secretKeyRef:
          name: loki-s3-secret
          key: S3_SECRET_ACCESS_KEY

# Disable scalable components — SingleBinary mode owns everything.
write:
  replicas: 0
read:
  replicas: 0
backend:
  replicas: 0

gateway:
  enabled: true
  replicas: 1
  nginxConfig:
    resolver: coredns.kube-system.svc.cluster.local.
  # NodePort で host の Alloy から push できるようにする。
  # LB IP 経由だと Cilium L2 announcer の lease holder ノード自身からの
  # hairpin が成立せず "No route to host" になるため (socketLB が LB IP
  # を redirect しない)。localhost:NodePort なら eBPF kube-proxy
  # replacement が local backend pod に直接転送するので ARP 不要。
  service:
    type: NodePort
    nodePort: 30800

chunksCache:
  enabled: false

resultsCache:
  enabled: false

minio:
  enabled: false

lokiCanary:
  enabled: false

monitoring:
  selfMonitoring:
    enabled: false
    grafanaAgent:
      installOperator: false

test:
  enabled: false
