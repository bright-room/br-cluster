---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: loki-s3
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword-backend
    kind: ClusterSecretStore
  target:
    name: loki-s3-secret
  data:
    # external-secrets の onepassword-connect provider は item.Fields[] を
    # label でフラット検索するため (section 参照非対応)、garage item 内の
    # field label を section 名プレフィクス付きで unique にしている。
    # ansible (fetch_garage_operators.yaml) 側も同じ label を参照する。
    - secretKey: S3_ACCESS_KEY_ID
      remoteRef:
        key: garage
        property: loki_access_key_id
    - secretKey: S3_SECRET_ACCESS_KEY
      remoteRef:
        key: garage
        property: loki_secret_access_key
