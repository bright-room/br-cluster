---
# Per-DB login credentials for argo_workflows. basic-auth shape so CNPG
# managed.roles can consume passwordSecret directly.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: platform-pg-argo-workflows
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword-backend
    kind: ClusterSecretStore
  target:
    name: platform-pg-argo-workflows
    template:
      type: kubernetes.io/basic-auth
      data:
        username: argo_workflows
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: argo-workflows
        property: db_password
