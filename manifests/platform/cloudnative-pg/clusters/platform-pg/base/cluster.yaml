---
# Platform-shared PostgreSQL cluster.
#
# One physical CNPG cluster hosts multiple logical databases for platform
# components. Each app gets its own database and its own login role; roles
# MUST NOT be granted ownership/privileges on databases other than their own.
# Add new databases via CNPG's Database CRD (operator v1.25+) in separate
# manifest files; do NOT extend bootstrap.initdb after the initial bootstrap.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: platform-pg
  namespace: platform-pg
spec:
  instances: 2
  imageName: ghcr.io/cloudnative-pg/postgresql:16.4
  primaryUpdateStrategy: unsupervised

  storage:
    size: 5Gi
    storageClass: longhorn

  monitoring:
    enablePodMonitor: true

  # Initial DB + owner role for Zitadel. Password is supplied via the
  # secret referenced below (ExternalSecret populates it from 1Password).
  bootstrap:
    initdb:
      database: zitadel
      owner: zitadel
      secret:
        name: platform-pg-zitadel

  # Additional login roles. Databases owned by these roles are declared
  # via separate Database CRDs (operator v1.25+) — see database-*.yaml.
  managed:
    roles:
      - name: argo_workflows
        ensure: present
        login: true
        passwordSecret:
          name: platform-pg-argo-workflows

  # Node affinity: worker pool, spread across hosts.
  affinity:
    nodeSelector:
      node_type: worker
    topologyKey: kubernetes.io/hostname

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 512Mi
