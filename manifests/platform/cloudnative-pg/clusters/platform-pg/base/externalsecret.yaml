# Per-DB login credentials. Stored as kubernetes.io/basic-auth so CNPG
# can consume it directly in bootstrap.initdb.secret and for connection.
# Username is fixed per DB (1 DB : 1 role); no cross-DB roles.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: platform-pg-zitadel
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword-backend
    kind: ClusterSecretStore
  target:
    name: platform-pg-zitadel
    template:
      type: kubernetes.io/basic-auth
      data:
        username: zitadel
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: zitadel
        property: db_password
