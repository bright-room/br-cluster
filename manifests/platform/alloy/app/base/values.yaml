# alloy helm values (base)
#
# Single agent replacing the retired fluent-bit + fluentd stack. Runs as a
# DaemonSet on workers only, collects container logs from /var/log/containers
# via the Kubernetes API, and receives OTLP from app Pods.
#
# Responsibility split with the OTel Collector gateway (Phase A):
#   - Alloy (this file) = pod log collection + OTLP receive + Logs→Loki direct push
#   - opentelemetry-collector (gateway) = Traces / Metrics processing and fan-out
# Logs go Alloy → Loki directly to keep the path single. Traces go
# Alloy → Collector → Tempo so tail_sampling / batching live in one place.

alloy:
  configMap:
    create: true
    content: |
      logging {
        level  = "info"
        format = "logfmt"
      }

      // --- Pod log collection ---------------------------------------------

      discovery.kubernetes "pods" {
        role = "pod"
        selectors {
          role  = "pod"
          field = "spec.nodeName=" + sys.env("NODE_NAME")
        }
      }

      discovery.relabel "pods" {
        targets = discovery.kubernetes.pods.targets
        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
          target_label  = "app"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_node_name"]
          target_label  = "node"
        }
      }

      loki.source.kubernetes "pods" {
        targets    = discovery.relabel.pods.output
        forward_to = [loki.write.default.receiver]
      }

      // --- OTLP receiver for application telemetry ------------------------

      otelcol.receiver.otlp "default" {
        grpc {
          endpoint = "0.0.0.0:4317"
        }
        http {
          endpoint = "0.0.0.0:4318"
        }
        output {
          logs   = [otelcol.processor.batch.default.input]
          traces = [otelcol.processor.batch.default.input]
        }
      }

      otelcol.processor.batch "default" {
        output {
          logs   = [otelcol.exporter.loki.default.input]
          traces = [otelcol.exporter.otlp.gateway.input]
        }
      }

      otelcol.exporter.loki "default" {
        forward_to = [loki.write.default.receiver]
      }

      // Traces fan out via the OTel Collector gateway, not direct to Tempo,
      // so tail_sampling lives in one place (see Phase A).
      otelcol.exporter.otlp "gateway" {
        client {
          endpoint = "opentelemetry-collector.opentelemetry-collector.svc.cluster.local:4317"
          tls {
            insecure = true
          }
        }
      }

      // --- Sinks ----------------------------------------------------------

      loki.write "default" {
        endpoint {
          url = "http://loki-gateway.loki.svc.cluster.local/loki/api/v1/push"
        }
      }

  extraPorts:
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
      protocol: TCP
    - name: otlp-http
      port: 4318
      targetPort: 4318
      protocol: TCP

  extraEnv:
    - name: NODE_NAME
      valueFrom:
        fieldRef:
          fieldPath: spec.nodeName

controller:
  type: daemonset

service:
  enabled: true
  internalTrafficPolicy: Local

rbac:
  create: true

serviceAccount:
  create: true

serviceMonitor:
  enabled: false
