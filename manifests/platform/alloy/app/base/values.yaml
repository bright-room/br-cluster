# alloy helm values (base)
#
# Single agent replacing the retired fluent-bit + fluentd stack. Runs as a
# DaemonSet on workers only, tails container log files from /var/log/pods
# directly (no apiserver log-follow), and receives OTLP from app Pods.
#
# Why file tailing, not loki.source.kubernetes:
# loki.source.kubernetes opens one apiserver log-follow stream per pod. On
# nodes with many pods that trips client-go QPS throttling, causes http2
# connection loss, and the resulting tailer restarts pin CPU at the limit.
# Reading /var/log/pods/*/*/*.log directly scales with disk I/O instead.
#
# Responsibility split with the OTel Collector gateway (Phase A):
#   - Alloy (this file) = pod log collection + OTLP receive + Logs→Loki direct push
#   - opentelemetry-collector (gateway) = Traces / Metrics processing and fan-out
# Logs go Alloy → Loki directly to keep the path single. Traces go
# Alloy → Collector → Tempo so tail_sampling / batching live in one place.

alloy:
  mounts:
    varlog: true

  configMap:
    create: true
    content: |
      logging {
        level  = "info"
        format = "logfmt"
      }

      // --- Pod log collection (file tailing) ------------------------------

      local.file_match "pods" {
        path_targets = [{"__path__" = "/var/log/pods/*/*/*.log"}]
      }

      loki.process "pods" {
        forward_to = [loki.write.default.receiver]

        // Extract namespace / pod / container from the kubelet log path:
        //   /var/log/pods/<namespace>_<pod>_<uid>/<container>/<N>.log
        stage.regex {
          source     = "filename"
          expression = "/var/log/pods/(?P<namespace>[^_]+)_(?P<pod>.+)_[^/]+/(?P<container>[^/]+)/[^/]+\\.log"
        }
        stage.labels {
          values = {
            namespace = "",
            pod       = "",
            container = "",
          }
        }
        stage.static_labels {
          values = {
            node = sys.env("NODE_NAME"),
          }
        }

        // filename has one value per log file — high cardinality. Drop it
        // after we've used it to derive the labels above.
        stage.label_drop {
          values = ["filename"]
        }

        // CRI log line format: <time> <stream> <tag> <content>
        // Drop the wrapper, keep the app payload.
        stage.cri { }
      }

      loki.source.file "pods" {
        targets    = local.file_match.pods.targets
        forward_to = [loki.process.pods.receiver]
      }

      // --- OTLP receiver for application telemetry ------------------------

      otelcol.receiver.otlp "default" {
        grpc {
          endpoint = "0.0.0.0:4317"
        }
        http {
          endpoint = "0.0.0.0:4318"
        }
        output {
          logs   = [otelcol.processor.batch.default.input]
          traces = [otelcol.processor.batch.default.input]
        }
      }

      otelcol.processor.batch "default" {
        output {
          logs   = [otelcol.exporter.loki.default.input]
          traces = [otelcol.exporter.otlp.gateway.input]
        }
      }

      otelcol.exporter.loki "default" {
        forward_to = [loki.write.default.receiver]
      }

      // Traces fan out via the OTel Collector gateway, not direct to Tempo,
      // so tail_sampling lives in one place (see Phase A).
      otelcol.exporter.otlp "gateway" {
        client {
          endpoint = "opentelemetry-collector.opentelemetry-collector.svc.cluster.local:4317"
          tls {
            insecure = true
          }
        }
      }

      // --- Sinks ----------------------------------------------------------

      loki.write "default" {
        endpoint {
          url = "http://loki-gateway.loki.svc.cluster.local/loki/api/v1/push"
        }
      }

  extraPorts:
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
      protocol: TCP
    - name: otlp-http
      port: 4318
      targetPort: 4318
      protocol: TCP

  extraEnv:
    - name: NODE_NAME
      valueFrom:
        fieldRef:
          fieldPath: spec.nodeName

controller:
  type: daemonset

service:
  enabled: true
  internalTrafficPolicy: Local

rbac:
  create: true

serviceAccount:
  create: true

serviceMonitor:
  enabled: false
