# Managed by scripts/fetch-grafana-dashboards.sh — do not edit by hand.
# To refresh, re-run the script.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: grafana

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: grafana-dashboard-node-exporter-full
    files:
      - json/node-exporter-full.json
    options:
      labels:
        grafana_dashboard: "1"
      annotations:
        grafana_folder: Host
  - name: grafana-dashboard-kubernetes-views-global
    files:
      - json/kubernetes-views-global.json
    options:
      labels:
        grafana_dashboard: "1"
      annotations:
        grafana_folder: Kubernetes
  - name: grafana-dashboard-loki
    files:
      - json/loki.json
    options:
      labels:
        grafana_dashboard: "1"
      annotations:
        grafana_folder: Observability
  - name: grafana-dashboard-tempo
    files:
      - json/tempo.json
    options:
      labels:
        grafana_dashboard: "1"
      annotations:
        grafana_folder: Observability
  - name: grafana-dashboard-alertmanager
    files:
      - json/alertmanager.json
    options:
      labels:
        grafana_dashboard: "1"
      annotations:
        grafana_folder: Observability
  - name: grafana-dashboard-cloudnative-pg
    files:
      - json/cloudnative-pg.json
    options:
      labels:
        grafana_dashboard: "1"
      annotations:
        grafana_folder: Database
  - name: grafana-dashboard-longhorn
    files:
      - json/longhorn.json
    options:
      labels:
        grafana_dashboard: "1"
      annotations:
        grafana_folder: Storage
