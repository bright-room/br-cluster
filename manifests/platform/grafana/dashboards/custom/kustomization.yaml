# Hand-written dashboards for br-cluster 固有の観測経路。fetch-grafana-dashboards.sh
# は base/ のみ regenerate するのでこちらには触らない。
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: grafana

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: grafana-dashboard-kubernetes-events
    files:
      - json/kubernetes-events.json
    options:
      labels:
        grafana_dashboard: "1"
      annotations:
        grafana_folder: Observability
  - name: grafana-dashboard-envoy-access-log
    files:
      - json/envoy-access-log.json
    options:
      labels:
        grafana_dashboard: "1"
      annotations:
        grafana_folder: Observability
