apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - helm.yaml
  - externalsecret.yaml
  - oidc-externalsecret.yaml

configMapGenerator:
  - name: grafana-helm-values
    files:
      - base-values.yaml=values.yaml
configurations:
  - kustomizeconfig.yaml
