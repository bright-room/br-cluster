# Bridges tofu-controller's outputs Secret (grafana_client_id /
# grafana_client_secret in the tf-zitadel-output Secret in the zitadel
# namespace) to the env var names Grafana's config reader recognises:
# GF_<SECTION>_<KEY> overrides grafana.ini[SECTION][KEY]. The Secret is
# then consumed via `envFromSecret` in helm values so every key in it
# appears as a pod env var without further per-key mapping.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-oidc
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: kubernetes-backend
    kind: ClusterSecretStore
  target:
    name: grafana-oidc
    template:
      data:
        GF_AUTH_GENERIC_OAUTH_CLIENT_ID: "{{ .client_id }}"
        GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET: "{{ .client_secret }}"
  data:
    - secretKey: client_id
      remoteRef:
        key: tf-zitadel-output
        property: grafana_client_id
    - secretKey: client_secret
      remoteRef:
        key: tf-zitadel-output
        property: grafana_client_secret
