# grafana helm values (base)
#
# Authentication:
#   - Zitadel OIDC via Grafana's native auth.generic_oauth. Layering Envoy's
#     SecurityPolicy OIDC on top would force a double login dance, so
#     grafana.b8m.app is intentionally excluded from the gateway-level
#     SecurityPolicy set.
#   - Client credentials arrive as env vars (GF_AUTH_GENERIC_OAUTH_CLIENT_ID /
#     _SECRET) through the grafana-oidc Secret (see externalsecret-oidc.yaml).
#   - Break-glass local admin stays enabled (reachable via kubectl port-forward)
#     as a last-resort recovery path if OIDC goes sideways.
#   - Every OIDC-signed-in user becomes Org Admin because the cluster has a
#     single operator; tighten this once there's anyone to tighten against.

admin:
  existingSecret: grafana-admin-secret
  userKey: admin-user
  passwordKey: admin-password

envFromSecret: grafana-oidc

# Dashboard provisioning via sidecar. ConfigMaps in any namespace with label
# `grafana_dashboard=1` are watched; the optional `grafana_folder` annotation
# places them in a folder of that name. Dashboards live in
# manifests/platform/grafana/dashboards/ (fetched via
# scripts/fetch-grafana-dashboards.sh); Cilium / Hubble also ship their own
# dashboards from the cilium chart using the same label convention.
#
# datasources are NOT handled by the sidecar — they are declared directly in
# the `datasources` block below because they are few, static, and need
# predictable UIDs (referenced by dashboards and the Tempo→Loki trace link).
sidecar:
  dashboards:
    enabled: true
    label: grafana_dashboard
    labelValue: "1"
    folderAnnotation: grafana_folder
    provider:
      foldersFromFilesStructure: true
    searchNamespace: ALL
  datasources:
    enabled: false

grafana.ini:
  server:
    root_url: https://grafana.b8m.app
  users:
    auto_assign_org_role: Admin
  auth.generic_oauth:
    enabled: true
    name: Zitadel
    scopes: openid profile email
    auth_url: https://auth.b8m.app/oauth/v2/authorize
    token_url: https://auth.b8m.app/oauth/v2/token
    api_url: https://auth.b8m.app/oidc/v1/userinfo
    allow_sign_up: true

# RWO PVC requires Recreate strategy — RollingUpdate causes Multi-Attach errors
# because the new pod tries to claim the volume before the old one releases it.
deploymentStrategy:
  type: Recreate
  rollingUpdate: null

persistence:
  enabled: true
  storageClassName: longhorn
  size: 5Gi

datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        uid: prometheus
        url: http://kube-prometheus-stack-prometheus.kube-prom-stack.svc.cluster.local:9090
        access: proxy
        isDefault: true
        jsonData:
          timeInterval: 30s
      - name: Loki
        type: loki
        uid: loki
        url: http://loki-gateway.loki.svc.cluster.local:80
        access: proxy
        jsonData:
          derivedFields:
            - datasourceUid: tempo
              matcherRegex: '"traceID":"(\w+)"'
              name: TraceID
              url: "$${__value.raw}"
      - name: Tempo
        type: tempo
        uid: tempo
        url: http://tempo.tempo.svc.cluster.local:3200
        access: proxy
        jsonData:
          tracesToLogsV2:
            datasourceUid: loki
          tracesToMetrics:
            datasourceUid: prometheus
          nodeGraph:
            enabled: true
          # serviceMap requires Tempo metrics-generator which is not enabled
          # (too heavy for Pi). Re-enable if metrics-generator is added later.
