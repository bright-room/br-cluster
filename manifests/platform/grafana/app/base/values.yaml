# grafana helm values (base)
#
# Authentication:
#   - Cloudflare Access (GitHub SSO) validates the user at the edge and injects
#     a signed JWT as `Cf-Access-Jwt-Assertion`. Grafana verifies it with the
#     CF Access JWKS and auto-signs in the user.
#   - Break-glass local admin is always enabled (reachable via kubectl port-forward).

admin:
  existingSecret: grafana-admin-secret
  userKey: admin-user
  passwordKey: admin-password

grafana.ini:
  server:
    root_url: https://grafana.b8m.app
  auth.jwt:
    enabled: true
    header_name: Cf-Access-Jwt-Assertion
    email_claim: email
    username_claim: email
    jwk_set_url: https://bright-room.cloudflareaccess.com/cdn-cgi/access/certs
    cache_ttl: 60m
    auto_sign_up: true
    role_attribute_path: "'Admin'"
    allow_assign_grafana_admin: true

# RWO PVC requires Recreate strategy — RollingUpdate causes Multi-Attach errors
# because the new pod tries to claim the volume before the old one releases it.
deploymentStrategy:
  type: Recreate
  rollingUpdate: null

persistence:
  enabled: true
  storageClassName: longhorn
  size: 5Gi

datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        uid: prometheus
        url: http://kube-prometheus-stack-prometheus.kube-prom-stack.svc.cluster.local:9090
        access: proxy
        isDefault: true
        jsonData:
          timeInterval: 30s
      - name: Loki
        type: loki
        uid: loki
        url: http://loki-gateway.loki.svc.cluster.local:80
        access: proxy
        jsonData:
          derivedFields:
            - datasourceUid: tempo
              matcherRegex: '"traceID":"(\w+)"'
              name: TraceID
              url: "$${__value.raw}"
      - name: Tempo
        type: tempo
        uid: tempo
        url: http://tempo.tempo.svc.cluster.local:3200
        access: proxy
        jsonData:
          tracesToLogsV2:
            datasourceUid: loki
          tracesToMetrics:
            datasourceUid: prometheus
          nodeGraph:
            enabled: true
          # serviceMap requires Tempo metrics-generator which is not enabled
          # (too heavy for Pi). Re-enable if metrics-generator is added later.
