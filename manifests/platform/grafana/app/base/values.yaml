# grafana helm values (base)
#
# Phase B: standalone Grafana with Prometheus/Loki/Tempo DataSources.
# Phase E: Keycloak OIDC via Grafana built-in auth.generic_oauth.
# Break-glass local admin is always enabled.

admin:
  existingSecret: grafana-admin-secret
  userKey: admin-user
  passwordKey: admin-password

envFromSecrets:
  - name: grafana-oidc-secret
    optional: true

grafana.ini:
  server:
    root_url: https://grafana.cluster-internal.bright-room.net
  auth.generic_oauth:
    enabled: true
    name: Keycloak
    allow_sign_up: true
    auto_login: false
    client_id: grafana
    client_secret: $__env{OIDC_CLIENT_SECRET}
    scopes: openid email profile
    auth_url: https://keycloak.cluster-internal.bright-room.net/realms/platform/protocol/openid-connect/auth
    token_url: https://keycloak.cluster-internal.bright-room.net/realms/platform/protocol/openid-connect/token
    api_url: https://keycloak.cluster-internal.bright-room.net/realms/platform/protocol/openid-connect/userinfo
    role_attribute_path: "'Admin'"
    allow_assign_grafana_admin: true

# RWO PVC requires Recreate strategy — RollingUpdate causes Multi-Attach errors
# because the new pod tries to claim the volume before the old one releases it.
deploymentStrategy:
  type: Recreate
  rollingUpdate: null

persistence:
  enabled: true
  storageClassName: longhorn
  size: 5Gi

datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        uid: prometheus
        url: http://kube-prometheus-stack-prometheus.kube-prom-stack.svc.cluster.local:9090
        access: proxy
        isDefault: true
        jsonData:
          timeInterval: 30s
      - name: Loki
        type: loki
        uid: loki
        url: http://loki-gateway.loki.svc.cluster.local:80
        access: proxy
        jsonData:
          derivedFields:
            - datasourceUid: tempo
              matcherRegex: '"traceID":"(\w+)"'
              name: TraceID
              url: "$${__value.raw}"
      - name: Tempo
        type: tempo
        uid: tempo
        url: http://tempo.tempo.svc.cluster.local:3200
        access: proxy
        jsonData:
          tracesToLogsV2:
            datasourceUid: loki
          tracesToMetrics:
            datasourceUid: prometheus
          nodeGraph:
            enabled: true
          # serviceMap requires Tempo metrics-generator which is not enabled
          # (too heavy for Pi). Re-enable if metrics-generator is added later.
