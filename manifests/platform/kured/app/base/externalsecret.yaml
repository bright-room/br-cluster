---
# kured 用 Discord webhook URL。
# 1Password には raw URL (https://discord.com/api/webhooks/<ID>/<TOKEN>) が
# 入っているが、kured の notifyUrl は shoutrrr 形式 (discord://<TOKEN>@<ID>)
# なので、ESO の template (sprig) で path を分解して組み立て直す。
# uu (ホスト側 hook) と同じ Item / Field を共有する (1Password 1 本運用)。
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kured-discord-webhook
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword-backend
    kind: ClusterSecretStore
  target:
    name: kured-discord-webhook
    template:
      type: Opaque
      data:
        notify-url: |-
          {{- $parts := splitList "/" .webhook_url -}}
          {{- $id := index $parts 5 -}}
          {{- $token := index $parts 6 -}}
          discord://{{ $token }}@{{ $id }}
  data:
    - secretKey: webhook_url
      remoteRef:
        key: discord-webhook-cluster-maintenance
        property: webhook_url
