# Pod / Deployment / StatefulSet / Job level alerts, derived from
# kube-state-metrics. No extra scrape dependencies.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: workload-health
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: workload
      rules:
        - alert: KubePodCrashLooping
          expr: |
            max_over_time(
              kube_pod_container_status_waiting_reason{reason="CrashLoopBackOff"}[5m]
            ) >= 1
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: Pod {{ $labels.namespace }}/{{ $labels.pod }} is crash-looping
            description: |
              Container {{ $labels.container }} in pod
              {{ $labels.namespace }}/{{ $labels.pod }} has been
              CrashLoopBackOff for 15 minutes.

        - alert: KubePodNotReady
          expr: |
            sum by (namespace, pod) (
              max by (namespace, pod) (
                kube_pod_status_phase{phase=~"Pending|Unknown|Failed"}
              )
              * on (namespace, pod) group_left(owner_kind)
              topk by (namespace, pod) (
                1, max by (namespace, pod, owner_kind) (kube_pod_owner{owner_kind!="Job"})
              )
            ) > 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: Pod {{ $labels.namespace }}/{{ $labels.pod }} is not ready
            description: |
              Pod {{ $labels.namespace }}/{{ $labels.pod }} has been in a
              non-ready state for 15 minutes. Non-Job Pods only.

        - alert: KubeContainerWaiting
          expr: |
            sum by (namespace, pod, container) (
              kube_pod_container_status_waiting_reason{
                reason=~"ImagePullBackOff|ErrImagePull|CreateContainerError|CreateContainerConfigError|InvalidImageName"
              }
            ) > 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: Container {{ $labels.container }} in {{ $labels.namespace }}/{{ $labels.pod }} is stuck waiting
            description: |
              Container reason will be one of ImagePullBackOff / ErrImagePull /
              CreateContainerError / CreateContainerConfigError / InvalidImageName.

        - alert: KubeDeploymentReplicasMismatch
          expr: |
            (
              kube_deployment_spec_replicas != kube_deployment_status_replicas_available
            )
            and
            (
              changes(kube_deployment_status_replicas_updated[10m]) == 0
            )
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: Deployment {{ $labels.namespace }}/{{ $labels.deployment }} has not matched expected replicas
            description: |
              Deployment {{ $labels.namespace }}/{{ $labels.deployment }} has
              not matched the expected replica count and is not progressing.

        - alert: KubeStatefulSetReplicasMismatch
          expr: |
            (
              kube_statefulset_status_replicas_ready != kube_statefulset_status_replicas
            )
            and
            (
              changes(kube_statefulset_status_replicas_updated[10m]) == 0
            )
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: StatefulSet {{ $labels.namespace }}/{{ $labels.statefulset }} has not matched expected replicas
            description: |
              StatefulSet {{ $labels.namespace }}/{{ $labels.statefulset }} has
              not matched the expected replica count and is not progressing.

        - alert: KubeJobFailed
          expr: kube_job_failed > 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: Job {{ $labels.namespace }}/{{ $labels.job_name }} failed to complete
            description: |
              Job {{ $labels.namespace }}/{{ $labels.job_name }} has reported failure.
