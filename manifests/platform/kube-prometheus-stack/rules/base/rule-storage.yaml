---
# Storage-layer alerts.
#
# PersistentVolume* rules rely on kubelet volume stats (already scraped today).
# Longhorn rules require the Longhorn ServiceMonitor to be picked up by
# Prometheus — see docs/observability-plan.md P0-E (SM selector mismatch).
# Until that is fixed these rules evaluate to nothing but cost no effort.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: storage-health
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: persistent-volumes
      rules:
        - alert: PersistentVolumeAlmostFull
          expr: |
            (
              kubelet_volume_stats_available_bytes
              /
              kubelet_volume_stats_capacity_bytes
            ) < 0.10
            and
            kubelet_volume_stats_used_bytes > 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: PVC {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} has less than 10% free
            description: |
              Free space on PVC {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }}
              is {{ $value | humanizePercentage }}.

        - alert: PersistentVolumeAlmostFullCritical
          expr: |
            (
              kubelet_volume_stats_available_bytes
              /
              kubelet_volume_stats_capacity_bytes
            ) < 0.03
            and
            kubelet_volume_stats_used_bytes > 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: PVC {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} has less than 3% free
            description: |
              PVC {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} is
              {{ $value | humanizePercentage }} free. Pods using this PVC will
              soon start failing writes.

    - name: longhorn
      rules:
        # State codes: 1=creating 2=attached 3=detached 4=attaching
        # 5=detaching 6=deleting ... Anything other than 2 or 3 for long is bad.
        - alert: LonghornVolumeStatusUnhealthy
          expr: |
            longhorn_volume_robustness != 1 and longhorn_volume_robustness != 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: Longhorn volume {{ $labels.volume }} is unhealthy
            description: |
              longhorn_volume_robustness = {{ $value }} (3=faulted, 2=degraded).

        # robustness=2 (degraded) は replica rebuild 中も含む短期状態。
        # kured が `--alert-filter-regexp` でこの alert を見て、rebuild 進行中
        # は reboot を抑止する。severity=info にして通知は飛ばさない
        # (Alertmanager 側の routing で warning 以上のみ Discord へ流れる)。
        - alert: LonghornVolumeRebuilding
          expr: longhorn_volume_robustness == 2
          for: 30s
          labels:
            severity: info
          annotations:
            summary: Longhorn volume {{ $labels.volume }} is degraded / rebuilding
            description: |
              longhorn_volume_robustness = 2 (degraded). Replica rebuild may
              be in progress; kured will defer node reboot while this alert
              is firing.

        - alert: LonghornNodeStorageWarning
          expr: |
            longhorn_node_storage_usage_bytes
            /
            longhorn_node_storage_capacity_bytes > 0.85
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: Longhorn node {{ $labels.node }} storage usage above 85%
            description: |
              Longhorn node {{ $labels.node }} has used
              {{ $value | humanizePercentage }} of its declared capacity.
