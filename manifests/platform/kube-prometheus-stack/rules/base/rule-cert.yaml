---
# cert-manager certificate health.
# Requires the cert-manager ServiceMonitor to be picked up by Prometheus —
# see docs/observability-plan.md P0-E (SM selector mismatch). Until then these
# rules evaluate to nothing.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: cert-health
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: cert-manager
      rules:
        - alert: CertManagerCertExpirySoon
          expr: |
            avg by (exported_namespace, name) (
              certmanager_certificate_expiration_timestamp_seconds - time()
            ) < 14 * 24 * 3600
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: Certificate {{ $labels.exported_namespace }}/{{ $labels.name }} expires in under 14 days
            description: |
              Time until expiry: {{ $value | humanizeDuration }}. Verify the
              Issuer / ClusterIssuer is functional and renewal has not stalled.

        - alert: CertManagerCertNotReady
          expr: |
            max by (name, exported_namespace) (
              certmanager_certificate_ready_status{condition="False"}
            ) > 0
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: Certificate {{ $labels.exported_namespace }}/{{ $labels.name }} is not Ready
            description: |
              cert-manager reports the certificate as not Ready for 1 hour.

        - alert: CertManagerHighRenewalFailureRate
          expr: |
            sum by (exported_namespace, name) (
              rate(certmanager_certificate_renewal_errors_total[1h])
            ) > 0
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: cert-manager renewal errors on {{ $labels.exported_namespace }}/{{ $labels.name }}
            description: |
              Rate of renewal errors > 0 sustained for 1 hour. Check Issuer
              state and upstream ACME / DNS provider responses.
