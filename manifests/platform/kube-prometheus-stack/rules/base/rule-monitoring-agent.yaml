# monitoring_agent role (systemd node_exporter + rpi-metrics + Alloy journal)
# の自己死活監視。ソースは systemd node_exporter の --collector.systemd で
# provisioner/roles/monitoring_agent/templates/node_exporter.service.j2 で
# unit-include を alloy/node_exporter/rpi-metrics に絞って有効化している。
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: monitoring-agent-health
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: monitoring-agent
      rules:
        # Alloy (systemd-journald → Loki シッパー、全 8 ノードで稼働) が active
        # でない状態が 10 分続いたら発火。再起動中の瞬間断を許容するため for は長め。
        - alert: AlloyJournalDown
          expr: |
            node_systemd_unit_state{name="alloy.service", state="active"} == 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: Alloy journal shipper down on {{ $labels.instance }}
            description: |
              alloy.service が 10 分以上 active 状態になっていない。
              このノードの systemd-journald が Loki に届かなくなるため、
              kubelet / containerd / sshd 等のホストログが失われる。
              `ssh {{ $labels.instance }} 'systemctl status alloy; journalctl -u alloy -n 50'` で調査。

        # systemd 管理の node_exporter (:9101) 自身の死活。これが死ぬとこのホストの
        # host-monitoring メトリクスが全面停止する (hwmon / thermal_zone / textfile /
        # systemd 状態すべて)。up{} を使うのは、node_exporter 自身が止まると
        # node_systemd_unit_state メトリクス自体が出なくなるため。
        - alert: NodeExporterHostDown
          expr: up{job="node-exporter-host"} == 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: systemd node_exporter down on {{ $labels.instance }}
            description: |
              host-monitoring 用の systemd node_exporter (:9101) が 10 分以上
              scrape 不可。このホストの温度 / メモリ / textfile (rpi-metrics /
              alloy 状態など) が全て失われる。
              `ssh {{ $labels.instance }} 'systemctl status node_exporter'`。

        # rpi-metrics.timer は 60s ごとに rpi-metrics.service を発火して
        # vcgencmd で温度/クロック/電圧を textfile に書き出す。timer が止まると
        # Pi 固有メトリクスが停滞する (ただし値自体は残るので NodeTempHigh 等の
        # 閾値アラートは一切発火しなくなる = silent failure)。
        - alert: RpiMetricsTimerInactive
          expr: |
            node_systemd_unit_state{name="rpi-metrics.timer", state="active"} == 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: rpi-metrics timer inactive on {{ $labels.instance }}
            description: |
              rpi-metrics.timer が 15 分以上 active でない。Pi 固有の温度 /
              スロットル / 電圧 textfile が更新停止しており、RPi rules
              (NodeTempHigh / NodeThrottled 等) が silent に発火しなくなる。
              `ssh {{ $labels.instance }} 'systemctl status rpi-metrics.timer rpi-metrics.service'`。

        # alloy-events Deployment は K8s Events を Loki に流す専用 1 replica。
        # ここが落ちると Pod OOMKilled / FailedScheduling 等の cluster-wide
        # イベントが Loki に入らず silent に失われる (etcd に 1h しか残らない)。
        # kube-state-metrics の deployment_status_replicas_available を使う。
        # Deployment 本体の up{} scrape は serviceMonitor=false で無いため。
        - alert: AlloyEventsDown
          expr: |
            kube_deployment_status_replicas_available{namespace="alloy-events", deployment="alloy-events"} == 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: alloy-events deployment has 0 ready replicas
            description: |
              alloy-events Deployment (K8s Events → Loki シッパー) が 10 分以上
              ready replica 0。このクラスタの K8s Events が Loki に流れておらず、
              Pod 再起動理由 / FailedScheduling / OOMKilled 等の調査情報が
              失われている。
              `kubectl -n alloy-events get pod; kubectl -n alloy-events logs deploy/alloy-events --tail=50`。
