---
# Raspberry Pi-specific health alerts.
#
# Temperature comes from node_exporter's built-in thermal_zone collector.
# Throttle / under-voltage signals come from the rpi-metrics textfile timer
# (docs/observability-plan.md P1-B).
#
# job label `node-exporter-host` = systemd node_exporter (:9101), present on
# every host including gateway / external. Using this job instead of the
# DaemonSet's `node-exporter` ensures coverage is consistent across all 8
# nodes.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: rpi-health
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: rpi-temperature
      rules:
        - alert: NodeHighTemperature
          expr: |
            max by (instance) (
              node_thermal_zone_temp{job="node-exporter-host"}
            ) > 75
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: Node {{ $labels.instance }} CPU > 75°C
            description: |
              SoC temperature has been above 75°C for 5 minutes
              ({{ $value | printf "%.1f" }}°C). RPi 4B begins soft throttling
              around 80°C and hard throttling at 85°C; verify airflow,
              heatsink contact and ambient load.

        - alert: NodeCriticalTemperature
          expr: |
            max by (instance) (
              node_thermal_zone_temp{job="node-exporter-host"}
            ) > 80
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: Node {{ $labels.instance }} CPU > 80°C
            description: |
              SoC temperature has been above 80°C for 2 minutes
              ({{ $value | printf "%.1f" }}°C). Hard throttling imminent;
              cooling issue — investigate immediately.

    - name: rpi-power
      rules:
        - alert: NodeUndervoltageNow
          expr: rpi_throttled_undervoltage_now == 1
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: Under-voltage on {{ $labels.instance }}
            description: |
              Pi firmware is reporting under-voltage right now. The SoC will
              throttle automatically — fix the power supply (official 5V/3A
              PSU, thick USB-C cable) before expecting stable workloads.

        - alert: NodeFreqCappedNow
          expr: rpi_throttled_freq_capped_now == 1
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: ARM frequency capping active on {{ $labels.instance }}
            description: |
              Firmware is capping ARM frequency (usually due to sustained
              under-voltage or high temperature). Cross-check with
              NodeHighTemperature and NodeUndervoltageNow on this instance.

        - alert: NodeThrottledNow
          expr: rpi_throttled_now == 1
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: SoC throttling active on {{ $labels.instance }}
            description: |
              vcgencmd get_throttled reports active throttling. Often a
              downstream symptom of temperature or voltage; see the related
              Node*Now alerts.

    - name: rpi-since-boot
      rules:
        # These fire once and stay firing until the node reboots, by design —
        # they're "this node has a bad history this uptime" markers.
        # `for: 10m` avoids firing on a fresh reboot where the counter may
        # briefly be stale.
        - alert: NodeUndervoltageOccurred
          expr: rpi_throttled_undervoltage_occurred == 1
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: Node {{ $labels.instance }} has seen under-voltage since boot
            description: |
              At least one under-voltage event happened on this node during
              the current uptime. Check PSU / cable quality and review
              recent dmesg for "Under-voltage detected".

        - alert: NodeThrottledOccurred
          expr: rpi_throttled_occurred == 1
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: Node {{ $labels.instance }} has been throttled since boot
            description: |
              The SoC throttled at least once during the current uptime.
              Usually preceded by NodeHighTemperature or NodeUndervoltageNow
              at the time of the event.
