apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: external-nodes
  labels:
    release: kube-prometheus-stack
spec:
  endpoints:
    - port: metrics
      interval: 30s
      relabelings:
        - sourceLabels: [__meta_kubernetes_endpoint_address_target_name]
          targetLabel: instance
  selector:
    matchLabels:
      app: external-node-exporter
