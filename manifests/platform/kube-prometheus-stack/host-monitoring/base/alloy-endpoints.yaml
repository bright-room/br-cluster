---
# systemd Alloy の HTTP server (:12345) を全 8 ノードで scrape するための
# EndpointSlice。node_exporter (:9101) の host-nodes と同じ 8 ホストを指すが、
# port が違うので別スライス。Alloy は journal → Loki 専用として
# monitoring_agent role で systemd 常駐 (provisioner/roles/monitoring_agent)。
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: host-alloy
  labels:
    app: host-alloy
    kubernetes.io/service-name: host-alloy
addressType: IPv4
endpoints:
  - addresses:
      - 172.22.10.1
    nodeName: br-gateway1
    conditions:
      ready: true
  - addresses:
      - 172.22.10.50
    nodeName: br-external1
    conditions:
      ready: true
  - addresses:
      - 172.22.10.10
    nodeName: br-node1
    conditions:
      ready: true
  - addresses:
      - 172.22.10.11
    nodeName: br-node2
    conditions:
      ready: true
  - addresses:
      - 172.22.10.12
    nodeName: br-node3
    conditions:
      ready: true
  - addresses:
      - 172.22.10.13
    nodeName: br-node4
    conditions:
      ready: true
  - addresses:
      - 172.22.10.14
    nodeName: br-node5
    conditions:
      ready: true
  - addresses:
      - 172.22.10.15
    nodeName: br-node6
    conditions:
      ready: true
ports:
  - name: metrics
    port: 12345
    protocol: TCP
