---
# kube-prometheus-stack helm values (prod overlay)

# Keep stateful / heavy components off control-plane nodes (Pi 4GB).
# node-exporter DaemonSet intentionally omits nodeSelector so it continues
# to scrape control-plane nodes.
# See incident-2026-04-13-observability-cascade.md.

prometheus:
  prometheusSpec:
    nodeSelector:
      node_type: worker
    resources:
      requests:
        cpu: 200m
        memory: 768Mi
      limits:
        cpu: 1500m
        # 1Gi だとベースで 663Mi 使用 (66%)。P0-E で SM を 10+ 追加すると
        # series が 1.5〜2 倍に膨らむため先行して 2Gi へ引き上げ。
        # Pi 4B 8GB worker の空き容量には収まる。
        memory: 2Gi

alertmanager:
  alertmanagerSpec:
    nodeSelector:
      node_type: worker
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi

prometheusOperator:
  nodeSelector:
    node_type: worker
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi

kube-state-metrics:
  nodeSelector:
    node_type: worker
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi

prometheus-node-exporter:
  resources:
    requests:
      cpu: 50m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi
