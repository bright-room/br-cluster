# K3s-specific overrides
# K3s runs all control-plane components in a single binary,
# so individual component scraping must be disabled to avoid
# scrape errors against non-existent endpoints.

kubeApiServer:
  enabled: false

kubeControllerManager:
  enabled: false

kubeProxy:
  enabled: false

kubeScheduler:
  enabled: false

kubeEtcd:
  enabled: false

# Kubelet is the single scrape target for K3s metrics
kubelet:
  enabled: true

# Disable default rules and dashboards — they assume standard Kubernetes.
# K3s-specific mixins will be provided separately (k3s-mixins).
defaultRules:
  create: false

grafana:
  defaultDashboardsEnabled: false
