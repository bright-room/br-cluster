# K3s-specific overrides
# K3s runs all control-plane components in a single binary,
# so individual component scraping must be disabled to avoid
# scrape errors against non-existent endpoints.

kubeApiServer:
  enabled: false

kubeControllerManager:
  enabled: false

kubeProxy:
  enabled: false

kubeScheduler:
  enabled: false

# K3s embedded etcd exposes metrics on 2381/http when
# `etcd-expose-metrics: true` is set in the k3s server config
# (see provisioner/roles/k3s/templates/config.yaml.master.j2).
# `endpoints` are generated per env by `cluster-forge generate-manifests`
# into the overlay's `etcd-endpoints.yaml` (merged in after this file).
kubeEtcd:
  enabled: true
  service:
    enabled: true
    port: 2381
    targetPort: 2381
  serviceMonitor:
    scheme: http

# Kubelet is the single scrape target for K3s metrics
kubelet:
  enabled: true

# Disable default rules and dashboards — they assume standard Kubernetes.
# K3s-specific mixins will be provided separately (k3s-mixins).
defaultRules:
  create: false

grafana:
  defaultDashboardsEnabled: false
