# Full alertmanager.yaml provisioned via ExternalSecret template, with the
# Discord webhook URL pulled from 1Password at templating time.
#
# Why not use `alertmanager.config` in values + `alertmanagerSpec.secrets`?
#   prometheus-operator v0.90.1 validates `alertmanager.config` against its
#   own Go struct, which does NOT yet include `webhook_url_file` on
#   discordConfigs (upstream Alertmanager 0.28 supports it, operator lags).
#   The reconcile fails and the pod keeps running the previous (default)
#   config with a null receiver — Discord never gets anything.
#
#   Feeding the finished YAML via `alertmanagerSpec.configSecret` bypasses
#   the operator's parser entirely; it just mounts the Secret as-is.
#
# 1Password item: alertmanager
#   field: discord_webhook_url  (Discord channel Webhook URL)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-config
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword-backend
    kind: ClusterSecretStore
  target:
    name: alertmanager-config
    template:
      type: Opaque
      data:
        alertmanager.yaml: |
          global:
            resolve_timeout: 5m
          route:
            receiver: discord
            group_by: [alertname, namespace]
            group_wait: 30s
            group_interval: 5m
            repeat_interval: 4h
            routes:
              # Watchdog is a perma-firing sanity alert: if it stops arriving,
              # the alerting pipeline itself is broken. Longer cadence so it
              # doesn't drown real alerts.
              - matchers:
                  - alertname = "Watchdog"
                receiver: discord
                repeat_interval: 24h
          receivers:
            - name: "null"
            - name: discord
              discord_configs:
                - webhook_url: "{{ .webhook_url }}"
                  send_resolved: true
          inhibit_rules:
            # critical が鳴っているときに同じ alert の warning は抑止
            - source_matchers:
                - severity = "critical"
              target_matchers:
                - severity = "warning"
              equal: [alertname, namespace]
  data:
    - secretKey: webhook_url
      remoteRef:
        key: alertmanager
        property: discord_webhook_url
