---
# kube-prometheus-stack helm values (base)

prometheus:
  prometheusSpec:
    retention: 14d
    retentionSize: 50GB
    walCompression: true
    # Accept remote_write from the OTel Collector gateway (Phase A).
    enableRemoteWriteReceiver: true

    # Public URL used when Prometheus generates `generatorURL` on alerts (the
    # "Source" link Alertmanager passes to receivers). Without this, Discord /
    # other receivers would get the in-cluster Service URL which isn't
    # reachable from a browser.
    externalUrl: https://prometheus.b8m.app

    # Generate scrape configs with kubernetes_sd_configs role=endpointslice
    # rather than the default role=endpoints. Required so ServiceMonitors
    # backed by a manually-created EndpointSlice (host-monitoring, where the
    # headless Service has no pod selector) get picked up without needing
    # the deprecated classic v1 Endpoints API. prometheus-operator auto-
    # translates the default relabelings to the endpointslice-flavored meta
    # labels, so chart-shipped SMs continue to work unchanged.
    serviceDiscoveryRole: EndpointSlice

    # Pick up ServiceMonitor / PodMonitor / PrometheusRule / Probe resources
    # in any namespace regardless of labels. Default chart behavior requires
    # the `release: kube-prometheus-stack` label, which caused 10+ upstream
    # chart-shipped SMs (alloy / cert-manager / cilium / hubble / longhorn /
    # loki / tempo / otel-collector / external-dns / grafana) to stay dark.
    # Homelab scale — no multi-tenant isolation concerns.
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    probeSelectorNilUsesHelmValues: false
    scrapeConfigSelectorNilUsesHelmValues: false

    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: longhorn
          resources:
            requests:
              storage: 10Gi

alertmanager:
  alertmanagerSpec:
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: longhorn
          resources:
            requests:
              storage: 1Gi

    # Public URL used when Alertmanager constructs silence / alert links that
    # receivers (Discord etc.) embed into notifications. Without this, the
    # Source / Silence URLs resolve to the in-cluster Service and aren't
    # clickable from the operator's browser.
    externalUrl: https://alertmanager.b8m.app

    # Feed the whole alertmanager.yaml from a Secret managed by ExternalSecret
    # (see externalsecret-alertmanager-config.yaml). Bypasses
    # prometheus-operator's schema validation, which rejects fields the
    # upstream Alertmanager supports but the operator doesn't yet know about
    # (e.g. webhook_url_file on discordConfigs in v0.90.1). The ExternalSecret
    # template embeds the Discord webhook URL directly at render time, so the
    # final YAML Alertmanager reads never contains a file reference.
    configSecret: alertmanager-config

  # `config:` is intentionally NOT set — configSecret wins, but leaving both
  # causes confusion. The routing / receivers / inhibit rules live inside the
  # ExternalSecret template instead.
