# kube-prometheus-stack helm values (base)

prometheus:
  prometheusSpec:
    retention: 14d
    retentionSize: 50GB
    walCompression: true
    # Accept remote_write from the OTel Collector gateway (Phase A).
    enableRemoteWriteReceiver: true

    # Pick up ServiceMonitor / PodMonitor / PrometheusRule / Probe resources
    # in any namespace regardless of labels. Default chart behavior requires
    # the `release: kube-prometheus-stack` label, which caused 10+ upstream
    # chart-shipped SMs (alloy / cert-manager / cilium / hubble / longhorn /
    # loki / tempo / otel-collector / external-dns / grafana) to stay dark.
    # Homelab scale — no multi-tenant isolation concerns.
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    probeSelectorNilUsesHelmValues: false
    scrapeConfigSelectorNilUsesHelmValues: false

    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: longhorn
          resources:
            requests:
              storage: 10Gi

alertmanager:
  alertmanagerSpec:
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: longhorn
          resources:
            requests:
              storage: 1Gi
    # Mount the Discord webhook URL secret at
    # /etc/alertmanager/secrets/alertmanager-discord-webhook/webhook_url so the
    # config below can reference it via webhook_url_file. Keeps the config
    # plain-text in PRs — only the URL is a secret.
    secrets:
      - alertmanager-discord-webhook

  # Routing tree and receivers. Discord is the only receiver for now — add
  # ntfy / email / pagerduty etc. as operations mature (see
  # docs/observability-plan.md P0-B). Cadence is intentionally conservative
  # until real alert patterns are known; tighten repeat_interval later.
  config:
    global:
      resolve_timeout: 5m
    route:
      receiver: discord
      group_by: [alertname, namespace]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      routes:
        # Watchdog is a perma-firing sanity alert: if it stops arriving, the
        # alerting pipeline itself is broken. Longer cadence so it doesn't drown
        # real alerts.
        - matchers:
            - alertname = "Watchdog"
          receiver: discord
          repeat_interval: 24h
    receivers:
      - name: "null"
      - name: discord
        discord_configs:
          - webhook_url_file: /etc/alertmanager/secrets/alertmanager-discord-webhook/webhook_url
            send_resolved: true
    inhibit_rules:
      # critical が鳴っているときに同じ alert の warning は抑止する
      - source_matchers:
          - severity = "critical"
        target_matchers:
          - severity = "warning"
        equal: [alertname, namespace]
