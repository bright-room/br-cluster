---
# Bridges the keys tofu-controller emits (alertmanager_client_id /
# alertmanager_client_secret inside the tf-zitadel-output Secret in the
# zitadel namespace) to the key names Envoy Gateway expects on its OIDC
# SecurityPolicy (client-id / client-secret).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-oidc
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: kubernetes-backend
    kind: ClusterSecretStore
  target:
    name: alertmanager-oidc
    template:
      data:
        client-id: "{{ .client_id }}"
        client-secret: "{{ .client_secret }}"
  data:
    - secretKey: client_id
      remoteRef:
        key: tf-zitadel-output
        property: alertmanager_client_id
    - secretKey: client_secret
      remoteRef:
        key: tf-zitadel-output
        property: alertmanager_client_secret
