# Gates prometheus.b8m.app behind Zitadel OIDC at the Envoy Gateway layer.
# backendRefs points at the Zitadel Service directly (see
# securitypolicy-alertmanager.yaml for the c-ares rationale).
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: prometheus-oidc
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: prometheus-b8m
  oidc:
    provider:
      issuer: https://auth.b8m.app
      backendRefs:
        - group: ""
          kind: Service
          name: zitadel
          namespace: zitadel
          port: 8080
    clientIDRef:
      name: prometheus-oidc
    clientSecret:
      name: prometheus-oidc
    redirectURL: https://prometheus.b8m.app/oauth2/callback
    logoutPath: /oauth2/logout
    scopes:
      - openid
      - profile
      - email
