# Gates alertmanager.b8m.app behind Zitadel OIDC at the Envoy Gateway layer.
# CF Access (github_organization + WARP device posture) still fronts the
# hostname; this policy adds the application-level identity so Alertmanager
# can consume an authenticated user instead of trusting edge JWTs blindly.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: alertmanager-oidc
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: alertmanager-b8m
  oidc:
    provider:
      issuer: https://auth.b8m.app
      # Envoy's c-ares DNS resolver silently fails to resolve in-cluster
      # STRICT_DNS names on this cluster (~10k dns.cares.get_addr_failure
      # hits observed), so the server-side token / userinfo / jwks calls
      # never find an endpoint. Bypass c-ares by pointing at the Zitadel
      # Service directly via EDS. The browser-facing authorize redirect
      # still takes the public path through CF Access.
      backendRefs:
        - group: ""
          kind: Service
          name: zitadel
          namespace: zitadel
          port: 8080
    clientIDRef:
      name: alertmanager-oidc
    clientSecret:
      name: alertmanager-oidc
    redirectURL: https://alertmanager.b8m.app/oauth2/callback
    logoutPath: /oauth2/logout
    scopes:
      - openid
      - profile
      - email
