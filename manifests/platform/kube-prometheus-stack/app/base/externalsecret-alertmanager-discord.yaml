# Discord webhook URL for Alertmanager's native discord_configs receiver.
#
# 1Password item: alertmanager
#   field: discord_webhook_url  (Discord channel Webhook URL)
#
# The URL is mounted into the Alertmanager pod via alertmanagerSpec.secrets and
# referenced from alertmanager.yaml as webhook_url_file so the config itself
# stays plain-text reviewable in PRs.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-discord-webhook
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword-backend
    kind: ClusterSecretStore
  target:
    name: alertmanager-discord-webhook
  data:
    - secretKey: webhook_url
      remoteRef:
        key: alertmanager
        property: discord_webhook_url
