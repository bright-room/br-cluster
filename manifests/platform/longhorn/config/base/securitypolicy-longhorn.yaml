---
# Gates longhorn.b8m.app behind Zitadel OIDC at the Envoy Gateway layer,
# then authorizes by Zitadel project role (admin / maintainer) via a JWT
# provider that reads the OIDC access token from a cookie.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: longhorn-oidc
  namespace: longhorn-system
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: longhorn-ui-b8m
  oidc:
    provider:
      issuer: https://auth.b8m.app
      backendRefs:
        - group: ""
          kind: Service
          name: zitadel
          namespace: zitadel
          port: 8080
    clientIDRef:
      name: longhorn-oidc
    clientSecret:
      name: longhorn-oidc
    redirectURL: https://longhorn.b8m.app/oauth2/callback
    logoutPath: /oauth2/logout
    scopes:
      - openid
      - profile
      - email
    # access token を named cookie に保存し、下の jwt provider が読む。
    cookieNames:
      accessToken: longhorn-access-token
  jwt:
    providers:
      - name: zitadel
        issuer: https://auth.b8m.app
        remoteJWKS:
          uri: https://auth.b8m.app/oauth/v2/keys
          backendRefs:
            - group: ""
              kind: Service
              name: zitadel
              namespace: zitadel
              port: 8080
        extractFrom:
          cookies:
            - longhorn-access-token
  authorization:
    defaultAction: Deny
    rules:
      - name: allow-admin-maintainer
        action: Allow
        principal:
          jwt:
            provider: zitadel
            claims:
              - name: roles
                valueType: StringArray
                values:
                  - admin
                  - maintainer
