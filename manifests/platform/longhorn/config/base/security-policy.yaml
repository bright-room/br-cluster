apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: longhorn-oidc
  namespace: longhorn-system
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: longhorn-ui
  oidc:
    provider:
      issuer: "https://keycloak.${CLUSTER_INTERNAL_DOMAIN}/realms/platform"
    clientID: "${OIDC_CLIENT_ID}"
    clientSecret:
      name: oidc-client-secret
    redirectURL: "https://longhorn.${CLUSTER_INTERNAL_DOMAIN}/oauth2/callback"
    logoutPath: "/oauth2/logout"
