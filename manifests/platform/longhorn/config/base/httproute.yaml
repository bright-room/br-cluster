apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: longhorn-ui
  namespace: longhorn-system
spec:
  parentRefs:
    - name: internal-gateway
      namespace: envoy-gateway-system
  hostnames:
    - "longhorn.${CLUSTER_INTERNAL_DOMAIN}"
  rules:
    - backendRefs:
        - name: longhorn-frontend
          port: 80
