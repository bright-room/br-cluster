---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: csi-external-snapshotter
spec:
  interval: 30m
  url: https://piraeus.io/helm-charts/
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: csi-external-snapshotter
spec:
  interval: 30m
  chart:
    spec:
      chart: snapshot-controller
      version: 5.2.0
      sourceRef:
        kind: HelmRepository
        name: csi-external-snapshotter
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  valuesFrom:
  - kind: ConfigMap
    name: csi-external-snapshotter-helm-values
    valuesKey: base-values.yaml
