---
# alloy-cp helm values (base)
#
# P2-B shadow-mode Alloy for control-plane nodes (Pi 4B 4GB).
#
# Why a separate release instead of extending the worker Alloy DS:
#   - Independent resource limits (CP is memory-tight; cascade 2026-04-13)
#   - Independent node targeting during the 1-2 week shadow period
#   - Fully reversible: delete this release → worker Alloy untouched
#
# Pod log tailing config mirrors the worker Alloy (file tailing, not
# loki.source.kubernetes — see alloy/app/base/values.yaml for rationale).
# No OTLP receiver here: app workloads do not run on CP, so the receiver
# would be dead weight.

alloy:
  mounts:
    varlog: true

  configMap:
    create: true
    content: |
      logging {
        level  = "info"
        format = "logfmt"
      }

      // --- Pod log collection (file tailing) ------------------------------

      local.file_match "pods" {
        path_targets = [{"__path__" = "/var/log/pods/*/*/*.log"}]
      }

      loki.process "pods" {
        forward_to = [loki.write.default.receiver]

        // Extract namespace / pod / container from the kubelet log path:
        //   /var/log/pods/<namespace>_<pod>_<uid>/<container>/<N>.log
        stage.regex {
          source     = "filename"
          expression = "/var/log/pods/(?P<namespace>[^_]+)_(?P<pod>.+)_[^/]+/(?P<container>[^/]+)/[^/]+\\.log"
        }
        stage.labels {
          values = {
            namespace = "",
            pod       = "",
            container = "",
          }
        }
        stage.static_labels {
          values = {
            node = sys.env("NODE_NAME"),
          }
        }

        stage.label_drop {
          values = ["filename"]
        }

        stage.cri { }
      }

      loki.source.file "pods" {
        targets    = local.file_match.pods.targets
        forward_to = [loki.process.pods.receiver]
      }

      // --- Sink -----------------------------------------------------------

      loki.write "default" {
        endpoint {
          url = "http://loki-gateway.loki.svc.cluster.local/loki/api/v1/push"
        }
      }

  extraEnv:
    - name: NODE_NAME
      valueFrom:
        fieldRef:
          fieldPath: spec.nodeName

controller:
  type: daemonset

service:
  enabled: false

rbac:
  create: true

serviceAccount:
  create: true

serviceMonitor:
  enabled: false
