apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudflared-config
data:
  config.yaml: |
    tunnel: ${CLOUDFLARED_CLUSTER_INTERNAL_TUNNEL_ID}
    credentials-file: /etc/cloudflared/credentials.json
    protocol: http2
    metrics: 0.0.0.0:2000
    no-autoupdate: true
    ingress:
      - hostname: "*.${CLUSTER_INTERNAL_DOMAIN}"
        service: https://${INTERNAL_GATEWAY_IP}:443
        originRequest:
          noTLSVerify: true
      - service: http_status:404
