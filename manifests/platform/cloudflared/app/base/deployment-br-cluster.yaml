---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared-br-cluster
  labels:
    app.kubernetes.io/name: cloudflared-br-cluster
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: cloudflared-br-cluster
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cloudflared-br-cluster
    spec:
      nodeSelector:
        node_type: worker
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: cloudflared-br-cluster
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:2026.3.0-arm64
          args:
            - tunnel
            - --config
            - /etc/cloudflared/config.yaml
            - run
          volumeMounts:
            - name: config
              mountPath: /etc/cloudflared/config.yaml
              subPath: config.yaml
              readOnly: true
            - name: credentials
              mountPath: /etc/cloudflared/credentials.json
              subPath: credentials.json
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /ready
              port: 2000
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /ready
              port: 2000
            periodSeconds: 10
      volumes:
        - name: config
          configMap:
            name: cloudflared-br-cluster-config
        - name: credentials
          secret:
            secretName: cloudflared-br-cluster-tunnel-credentials
