---
# coredns helm values (base)
replicaCount: 2
rollingUpdate:
  maxUnavailable: 0
  maxSurge: 1

# Override the default server block so we can slip a `hosts` entry in
# front of the kubernetes plugin. `auth.b8m.app` must resolve to the
# Envoy Gateway VIP (CLUSTER_GATEWAY_IP, advertised by Cilium L2) instead of
# going out through the CF Tunnel. The Gateway terminates TLS with the
# *.b8m.app cert and routes to the zitadel Service on 8080 via the
# existing HTTPRoute, so in-cluster clients (tofu-controller runner,
# envoy-gateway SecurityPolicy OIDC discovery) never touch CF Access.
# Everything else mirrors the chart defaults.
servers:
  - zones:
      - zone: .
        use_tcp: true
    port: 53
    plugins:
      - name: errors
      - name: health
        configBlock: |-
          lameduck 10s
      - name: ready
      - name: hosts
        configBlock: |-
          ${CLUSTER_GATEWAY_IP} auth.b8m.app
          fallthrough
      - name: kubernetes
        parameters: cluster.local in-addr.arpa ip6.arpa
        configBlock: |-
          pods insecure
          fallthrough in-addr.arpa ip6.arpa
          ttl 30
      - name: prometheus
        parameters: 0.0.0.0:9153
      - name: forward
        parameters: . /etc/resolv.conf
      - name: cache
        parameters: 30
      - name: loop
      - name: reload
      - name: loadbalance
