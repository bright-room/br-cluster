apiVersion: v1
kind: ConfigMap
metadata:
  name: garage-config
data:
  garage.toml: |
    metadata_dir = "/data/meta"
    data_dir = "/data/store"
    db_engine = "lmdb"
    replication_factor = 1

    rpc_bind_addr = "[::]:3901"
    rpc_secret_file = "/secrets/rpc/rpc_secret"

    [s3_api]
    s3_region = "ap-northeast-1"
    api_bind_addr = "[::]:3900"

    [admin]
    api_bind_addr = "[::]:3903"
