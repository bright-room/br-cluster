---
apiVersion: v1
kind: Service
metadata:
  name: garage
spec:
  type: ClusterIP
  selector:
    app: garage
  ports:
    - name: s3-api
      port: 3900
      targetPort: s3-api
    - name: admin
      port: 3903
      targetPort: admin
---
apiVersion: v1
kind: Service
metadata:
  name: garage-headless
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app: garage
  ports:
    - name: rpc
      port: 3901
      targetPort: rpc
