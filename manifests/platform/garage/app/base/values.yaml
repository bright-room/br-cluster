fullnameOverride: garage

image:
  repository: dxflrs/garage
  pullPolicy: IfNotPresent

deployment:
  kind: StatefulSet
  replicaCount: 1
  podManagementPolicy: OrderedReady

garage:
  existingRpcSecret: garage-rpc-secret
  garageTomlString: |
    metadata_dir = "/mnt/meta"
    data_dir = "/mnt/data"
    db_engine = "lmdb"
    replication_factor = 1
    consistency_mode = "consistent"
    rpc_bind_addr = "[::]:3901"
    rpc_secret = "__RPC_SECRET_REPLACE__"

    [kubernetes_discovery]
    namespace = "{{ .Release.Namespace }}"
    service_name = "{{ include "garage.fullname" . }}"
    skip_crd = false

    [s3_api]
    s3_region = "ap-northeast-1"
    api_bind_addr = "[::]:3900"

    [admin]
    api_bind_addr = "[::]:3903"
    admin_token_file = "/secrets/admin/admin_token"

persistence:
  enabled: true
  meta:
    storageClass: longhorn
    size: 1Gi
  data:
    storageClass: longhorn
    size: 20Gi

service:
  type: ClusterIP
  s3:
    api:
      port: 3900
    web:
      port: 3902

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 512Mi

livenessProbe:
  httpGet:
    path: /health
    port: 3903
  initialDelaySeconds: 10
  periodSeconds: 30

readinessProbe:
  httpGet:
    path: /health
    port: 3903
  initialDelaySeconds: 5
  periodSeconds: 10

extraVolumes:
  - name: admin-secret
    secret:
      secretName: garage-admin-secret
      defaultMode: 256

extraVolumeMounts:
  - name: admin-secret
    mountPath: /secrets/admin
    readOnly: true
