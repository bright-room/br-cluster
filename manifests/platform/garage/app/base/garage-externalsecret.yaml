apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: garage-rpc-secret
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-backend
  target:
    name: garage-rpc-secret
    creationPolicy: Owner
  data:
    - secretKey: rpc_secret
      remoteRef:
        key: garage-cluster-rpc-secret
        property: rpc_secret
