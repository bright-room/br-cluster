apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hubble-ui-b8m
  namespace: kube-system
  annotations:
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "true"
spec:
  parentRefs:
    - name: cluster-gateway
      namespace: envoy-gateway-system
      sectionName: https
  hostnames:
    - "hubble.${CLUSTER_DOMAIN}"
  rules:
    - backendRefs:
        - name: hubble-ui
          port: 80
