---
# Gates hubble.b8m.app behind Zitadel OIDC at the Envoy Gateway layer.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: hubble-oidc
  namespace: kube-system
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: hubble-ui-b8m
  oidc:
    provider:
      issuer: https://auth.b8m.app
      backendRefs:
        - group: ""
          kind: Service
          name: zitadel
          namespace: zitadel
          port: 8080
    clientIDRef:
      name: hubble-oidc
    clientSecret:
      name: hubble-oidc
    redirectURL: https://hubble.b8m.app/oauth2/callback
    logoutPath: /oauth2/logout
    scopes:
      - openid
      - profile
      - email
    # access token を named cookie に保存し、下の jwt provider が読む。
    cookieNames:
      accessToken: hubble-access-token
  jwt:
    providers:
      - name: zitadel
        issuer: https://auth.b8m.app
        remoteJWKS:
          uri: https://auth.b8m.app/oauth/v2/keys
          backendRefs:
            - group: ""
              kind: Service
              name: zitadel
              namespace: zitadel
              port: 8080
        extractFrom:
          cookies:
            - hubble-access-token
  authorization:
    defaultAction: Deny
    rules:
      - name: allow-admin-maintainer-developer
        action: Allow
        principal:
          jwt:
            provider: zitadel
            claims:
              - name: roles
                valueType: StringArray
                values:
                  - admin
                  - maintainer
                  - developer
