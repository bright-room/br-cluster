# keycloak helm values (base)
#
# Bitnami Keycloak behind Envoy Gateway (TLS terminated at proxy).
# DB is managed by CloudNativePG Cluster CR (keycloak/database/).

# TLS is terminated at Envoy — Keycloak listens on HTTP only
production: true
httpEnabled: true
proxyHeaders: xforwarded

replicaCount: 1

auth:
  adminUser: admin
  existingSecret: keycloak-admin-secret
  passwordSecretKey: admin-password

# Use CNPG-managed PostgreSQL (auto-generated secret: keycloak-postgresql-app)
postgresql:
  enabled: false

externalDatabase:
  host: keycloak-postgresql-rw
  port: 5432
  database: keycloak
  existingSecret: keycloak-postgresql-app
  existingSecretUserKey: username
  existingSecretPasswordKey: password
