---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hubble-flow-exporter
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hubble-flow-exporter
  labels:
    app.kubernetes.io/name: hubble-flow-exporter
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: hubble-flow-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hubble-flow-exporter
    spec:
      serviceAccountName: hubble-flow-exporter
      nodeSelector:
        node_type: worker
      # cilium image は全 k3s ノードに既にキャッシュされているので追加 pull 無し。
      # hubble CLI のバージョンを cilium と一致させたいという意図もある。
      containers:
        - name: hubble
          image: quay.io/cilium/cilium:v1.19.2
          imagePullPolicy: IfNotPresent
          command:
            - /usr/bin/hubble
          args:
            - observe
            - --server=hubble-relay.kube-system.svc.cluster.local:80
            - --verdict=DROPPED
            - --follow
            - --output=json
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 192Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
