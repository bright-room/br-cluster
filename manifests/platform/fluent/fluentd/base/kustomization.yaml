apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - fluentd-certificate.yaml
  - fluentd-externalsecret.yaml
  - fluentd-extservice.yaml
  - fluentd-config.yaml
  - helm.yaml

configMapGenerator:
  - name: fluentd-helm-values
    files:
      - base-values.yaml=values.yaml
configurations:
  - kustomizeconfig.yaml
