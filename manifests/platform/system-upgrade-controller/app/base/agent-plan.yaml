---
apiVersion: upgrade.cattle.io/v1
kind: Plan
metadata:
  name: agent-plan
  namespace: system-upgrade
spec:
  concurrency: 1
  cordon: true
  # Phase 1a: テスト worker 1 台 (br-node5) にのみ適用。
  # 他 worker / control-plane への影響を遮断した状態で動作確認する。
  # Phase 1b で control-plane 除外の本番 selector に解放する想定
  # (docs/proposals/k3s-upgrade.md 参照)。
  nodeSelector:
    matchExpressions:
      - { key: kubernetes.io/hostname, operator: In, values: ["br-node5"] }
  serviceAccountName: system-upgrade
  # renovate: datasource=github-releases depName=k3s-io/k3s versioning=loose
  version: "v1.36.4+k3s1"
  prepare:
    image: rancher/k3s-upgrade
    args: [prepare, server-plan]
  upgrade:
    image: rancher/k3s-upgrade
