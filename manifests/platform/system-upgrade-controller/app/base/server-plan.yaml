---
apiVersion: upgrade.cattle.io/v1
kind: Plan
metadata:
  name: server-plan
  namespace: system-upgrade
spec:
  concurrency: 1
  cordon: true
  # control-plane は br-cluster1 の 1 台のみ。この Plan を実行すると
  # クラスタが全停止するため、Phase 1a のテスト運用では対象にしない。
  # 本番展開は agent-plan で挙動を確認してから。
  nodeSelector:
    matchExpressions:
      - { key: kubernetes.io/hostname, operator: In, values: ["br-cluster1"] }
  serviceAccountName: system-upgrade
  # renovate: datasource=github-releases depName=k3s-io/k3s versioning=loose
  version: "v1.35.3+k3s1"
  upgrade:
    image: rancher/k3s-upgrade
