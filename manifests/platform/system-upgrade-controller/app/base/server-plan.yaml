---
apiVersion: upgrade.cattle.io/v1
kind: Plan
metadata:
  name: server-plan
  namespace: system-upgrade
spec:
  concurrency: 1
  cordon: true
  # Phase 1a: テスト worker 限定 nodeSelector で導入。
  # br-node5 は worker のため control-plane label と一致せず、
  # server-plan は実質 no-op (Job 生成されない) 状態で manifest 流入と
  # controller 認識のみを確認する。Phase 1b で本番 selector に解放する
  # 想定 (docs/proposals/k3s-upgrade.md 参照)。
  nodeSelector:
    matchExpressions:
      - { key: kubernetes.io/hostname, operator: In, values: ["br-node5"] }
  serviceAccountName: system-upgrade
  # renovate: datasource=github-releases depName=k3s-io/k3s versioning=loose
  version: "v1.35.5+k3s1"
  upgrade:
    image: rancher/k3s-upgrade
