---
# Lets ExternalSecret resources read Secrets that already live in this cluster
# and project them (with renaming / templating) into other namespaces. Used by
# consumers of tofu-controller's writeOutputsToSecret output: the Secret keys
# that tofu-controller emits don't line up with the field names Envoy Gateway
# (or other consumers) expect, so an ExternalSecret acts as the rename bridge.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubernetes-backend
  namespace: external-secrets
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kubernetes-backend
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["authorization.k8s.io"]
    resources: ["selfsubjectrulesreviews"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kubernetes-backend
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kubernetes-backend
subjects:
  - kind: ServiceAccount
    name: kubernetes-backend
    namespace: external-secrets
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: kubernetes-backend
spec:
  provider:
    kubernetes:
      remoteNamespace: zitadel
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          namespace: external-secrets
          key: ca.crt
      auth:
        serviceAccount:
          name: kubernetes-backend
          namespace: external-secrets
