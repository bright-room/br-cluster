apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: internal-gateway
  namespace: envoy-gateway-system
  annotations:
    # external-dns-coredns が gateway の target annotation を読んで
    # etcd (skydns schema) に A レコードを書く。LAN 限定 VIP。
    external-dns.alpha.kubernetes.io/target: ${INTERNAL_CLUSTER_GATEWAY_IP}
spec:
  gatewayClassName: internal-gateway
  addresses:
    - type: IPAddress
      value: ${INTERNAL_CLUSTER_GATEWAY_IP}
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      hostname: "*.${CLUSTER_INTERNAL_DOMAIN}"
      allowedRoutes:
        namespaces:
          from: All
