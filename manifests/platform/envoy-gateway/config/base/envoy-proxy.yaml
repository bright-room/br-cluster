apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: cluster-proxy
  namespace: envoy-gateway-system
spec:
  # Swap Envoy's default c-ares DNS resolver for the Linux getaddrinfo-based
  # resolver. The bundled c-ares silently fails in this cluster when resolving
  # the in-cluster hostname for SecurityPolicy OIDC provider STRICT_DNS
  # clusters (auth.b8m.app resolves fine for pods via CoreDNS, but Envoy's
  # own c-ares returns nothing — observed ~9500 dns.cares.get_addr_failure
  # in /stats). getaddrinfo uses the same /etc/resolv.conf CoreDNS path as
  # every other pod in the cluster, so resolution is consistent.
  #
  # Trade-off: getaddrinfo is synchronous; each resolve blocks an Envoy
  # worker thread briefly. At this cluster's request volume that's fine,
  # but if DNS-heavy workloads land here later, revisit and either pin
  # back to c-ares with explicit nameservers or keep getaddrinfo but
  # grow the worker pool.
  bootstrap:
    type: Merge
    value: |
      typed_dns_resolver_config:
        name: envoy.network.dns_resolver.getaddrinfo
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.network.dns_resolver.getaddrinfo.v3.GetAddrInfoDnsResolverConfig
  provider:
    type: Kubernetes
    kubernetes:
      envoyService:
        externalTrafficPolicy: Cluster
        annotations:
          io.cilium/lb-ipam-ips: ${CLUSTER_GATEWAY_IP}
  telemetry:
    tracing:
      samplingRate: 100
      provider:
        type: OpenTelemetry
        backendRefs:
          - name: opentelemetry-collector
            namespace: opentelemetry-collector
            port: 4317
      customTags:
        "k8s.pod.name":
          type: Environment
          environment:
            name: ENVOY_POD_NAME
            defaultValue: "-"
        "k8s.namespace.name":
          type: Environment
          environment:
            name: ENVOY_POD_NAMESPACE
            defaultValue: "envoy-gateway-system"
    accessLog:
      settings:
        - format:
            type: Text
            text: |
              [%START_TIME%] "%REQ(:METHOD)% %REQ(X-ENVOY-ORIGINAL-PATH?:PATH)% %PROTOCOL%" %RESPONSE_CODE% %RESPONSE_FLAGS% %BYTES_RECEIVED% %BYTES_SENT% %DURATION% "%REQ(X-FORWARDED-FOR)%" "%REQ(USER-AGENT)%" "%REQ(X-REQUEST-ID)%" "%REQ(:AUTHORITY)%" "%UPSTREAM_HOST%"
          sinks:
            - type: OpenTelemetry
              openTelemetry:
                host: opentelemetry-collector.opentelemetry-collector.svc.cluster.local
                port: 4317
                resources:
                  k8s.cluster.name: "br-cluster"
                  envoy.proxy.name: "cluster-proxy"
