apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: cluster-gateway
  namespace: envoy-gateway-system
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-issuer
    # external-dns v0.21.0 の gateway-api source は target annotation を
    # Gateway からのみ読む (HTTPRoute 側は読まれない)。参照:
    # source/gateway.go#L647 overrides: TargetsFromTargetAnnotation(gw.Annotations)
    external-dns.alpha.kubernetes.io/target: ${CLOUDFLARED_TUNNEL_CNAME}
spec:
  gatewayClassName: cluster-gateway
  addresses:
    - type: IPAddress
      value: ${CLUSTER_GATEWAY_IP}
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      hostname: "*.${CLUSTER_DOMAIN}"
      allowedRoutes:
        namespaces:
          from: All
      tls:
        mode: Terminate
        certificateRefs:
          - name: cluster-gateway-tls
