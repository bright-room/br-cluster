---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - helm.yaml
  - externalsecret-config.yaml
  - rbac.yaml

configMapGenerator:
  - name: flux-web-helm-values
    files:
      - base-values.yaml=values.yaml
  # Web Config API テンプレート。ExternalSecret が templateFrom で名前参照するため
  # ハッシュサフィックスを付けない (名前を安定させる)。
  - name: flux-web-config-tpl
    files:
      - config.yaml
    options:
      disableNameSuffixHash: true
configurations:
  - kustomizeconfig.yaml
