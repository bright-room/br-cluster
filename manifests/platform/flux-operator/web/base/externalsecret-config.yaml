---
# flux-web の Web Config API (config.yaml) を生成する。
#
# テンプレート本体は config.yaml ファイル (flux-web-config-tpl ConfigMap) に分離し、
# ここでは tf-zitadel-output の client 資格情報を埋めて flux-web-config Secret を
# 作るだけ。機密を helm values に注入しない (valuesFrom Secret を使わない) ことで
# helm-controller の observe ループを回避する。chart には web.configSecretName で渡す。
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: flux-web-config
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: kubernetes-backend
    kind: ClusterSecretStore
  target:
    name: flux-web-config
    template:
      engineVersion: v2
      templateFrom:
        - configMap:
            name: flux-web-config-tpl
            items:
              - key: config.yaml
  data:
    - secretKey: client_id
      remoteRef:
        key: tf-zitadel-output
        property: flux_web_client_id
    - secretKey: client_secret
      remoteRef:
        key: tf-zitadel-output
        property: flux_web_client_secret
