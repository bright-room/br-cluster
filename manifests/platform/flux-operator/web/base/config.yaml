---
# flux-web の Web Config API テンプレート。
#
# clientID / clientSecret のプレースホルダは ExternalSecret
# (externalsecret-config.yaml) が templateFrom でこのファイルを読み込み、
# tf-zitadel-output の値で埋めて flux-web-config Secret を生成する。
# chart には web.configSecretName で渡す。
# 注意: このファイルは ESO のテンプレートとしてそのまま評価されるので、
# コメントを含め client_id / client_secret のテンプレート構文を本文以外に書かない。
#
# 機密を HelmRelease の valuesFrom (Secret) で helm values に注入すると
# helm-controller が release を observe できず無限 upgrade ループに陥るため、
# config 全体を Secret 側に閉じ込め helm values は static に保つ。
apiVersion: web.fluxcd.controlplane.io/v1
kind: Config
spec:
  baseURL: https://flux.b8m.app
  # NOTE: userActions.access は flux-operator 0.45.1 の Web Config API スキーマに
  # まだ無く、configSecretName 経由の strict な config ローダーが unknown field と
  # して弾く ("unknown fields: .spec.userActions.access")。0.45.1 はそもそも
  # impersonation のみなので config 側には書かない。権限モード (Impersonated) は
  # helm value の web.userActions.access が web ClusterRole 生成に使う。
  authentication:
    type: OAuth2
    oauth2:
      provider: OIDC
      issuerURL: https://auth.b8m.app
      clientID: "{{ .client_id }}"
      clientSecret: "{{ .client_secret }}"
      impersonation:
        username: "claims.email"
        # Zitadel Action が注入する roles claim を k8s group として impersonate。
        # k8s RBAC は Group("admin"/"maintainer"/... ) に対して認可する。
        groups: "has(claims.roles) ? claims.roles : []"
