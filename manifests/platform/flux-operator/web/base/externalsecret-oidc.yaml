---
# Zitadel OIDC client credentials for the Flux Web UI. tofu-controller writes
# the Terraform outputs into the tf-zitadel-output Secret (zitadel namespace);
# the kubernetes-backend ClusterSecretStore bridges them into flux-system.
# The resulting flux-web-oidc Secret is consumed by the HelmRelease valuesFrom
# (see helm.yaml).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: flux-web-oidc
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: kubernetes-backend
    kind: ClusterSecretStore
  target:
    name: flux-web-oidc
    template:
      data:
        client-id: "{{ .client_id }}"
        client-secret: "{{ .client_secret }}"
  data:
    - secretKey: client_id
      remoteRef:
        key: tf-zitadel-output
        property: flux_web_client_id
    - secretKey: client_secret
      remoteRef:
        key: tf-zitadel-output
        property: flux_web_client_secret
