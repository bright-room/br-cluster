---
# flux-web は OAuth2 認証後、認証ユーザー (impersonation.username = claims.email)
# を impersonate して Kubernetes API を呼ぶ。flux-web-admin は chart が
# web.rbac.createRoles で生成する ClusterRole で、Flux リソースへのフルアクセス
# (reconcile / suspend / resume などのアクション含む) を持つ。
#
# 現状の運用者は kukv (普段使い管理者) ひとりなので email で直接束ねる。複数人
# 運用に広げる際は Zitadel 側で groups assertion を有効化し Group バインドへ
# 切り替える。
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: flux-web-admin-kukv
subjects:
  - kind: User
    name: koki-nonaka@outlook.jp
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: flux-web-admin
  apiGroup: rbac.authorization.k8s.io
