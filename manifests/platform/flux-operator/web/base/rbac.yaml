---
# Zitadel role(group) → k8s RBAC。flux-web は claims.roles を group として
# impersonate するので、Group 名 = role_key。
#   admin / maintainer → flux-web-admin（Flux リソース full）
#   developer          → flux-web-admin（sync 可。粒度を分けるなら別 ClusterRole）
#   viewer             → view（読み取り）
#
# flux-web-admin は chart が web.rbac.createRoles で生成する ClusterRole で、
# Flux リソースへのフルアクセス (reconcile / suspend / resume などのアクション
# 含む) を持つ。
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: flux-web-admin
roleRef:
  kind: ClusterRole
  name: flux-web-admin
  apiGroup: rbac.authorization.k8s.io
subjects:
  - kind: Group
    name: admin
    apiGroup: rbac.authorization.k8s.io
  - kind: Group
    name: maintainer
    apiGroup: rbac.authorization.k8s.io
  - kind: Group
    name: developer
    apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: flux-web-view
roleRef:
  kind: ClusterRole
  name: view
  apiGroup: rbac.authorization.k8s.io
subjects:
  - kind: Group
    name: viewer
    apiGroup: rbac.authorization.k8s.io
