apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: discord-webhook
  namespace: flux-system
spec:
  secretStoreRef:
    name: onepassword-backend
    kind: ClusterSecretStore
  target:
    name: discord-webhook
  data:
    - secretKey: address
      remoteRef:
        key: flux-system
        property: discord_webhook_url
