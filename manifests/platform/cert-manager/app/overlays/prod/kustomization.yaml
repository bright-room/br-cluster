apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: cert-manager

resources:
  - ../../base

components:
  - ../../components/dns01
  # gateway-api コンポーネントは envoy-gateway (Phase 4) デプロイ後に有効化する
  # - ../../components/gateway-api
  # monitoring コンポーネントは kube-prometheus-stack (Phase 7) デプロイ後に有効化する
  # - ../../components/monitoring

configMapGenerator:
  - name: cert-manager-helm-values
    behavior: merge
    files:
      - overlay-values.yaml=values.yaml

patches:
- target:
    group: helm.toolkit.fluxcd.io
    kind: HelmRelease
    name: cert-manager
  path: helm-patch.yaml
