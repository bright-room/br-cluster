# opentelemetry-collector helm values (prod overlay)
#
# Keep the gateway off control-plane Pi (4GB) and spread the 2 replicas
# across distinct workers so a single-node hang cannot take both down.
# See incident-2026-04-13-observability-cascade.md.

nodeSelector:
  node_type: worker

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: DoNotSchedule
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: opentelemetry-collector
        app.kubernetes.io/instance: opentelemetry-collector
