# opentelemetry-collector helm values (base)

image:
  repository: "otel/opentelemetry-collector-contrib"

fullnameOverride: otel-collector

mode: deployment

presets:
  kubernetesAttributes:
    enabled: true

resources:
  limits:
    memory: 200Mi

service:
  type: ClusterIP

ports:
  metrics:
    enabled: true

podAnnotations:
  prometheus.io/scrape: "true"

config:
  exporters:
    debug:
      verbosity: basic

  processors:
    resource:
      attributes:
        - key: service.instance.id
          from_attribute: k8s.pod.uid
          action: insert

  connectors:
    spanmetrics: {}

  service:
    pipelines: {}
    telemetry:
      metrics:
        level: detailed
        readers:
          - periodic:
              interval: 10000
              timeout: 5000
              exporter:
                otlp:
                  protocol: http/protobuf
                  endpoint: http://otel-collector:4318
