---
# zitadel helm values (base)
#
# Authentication flow:
#   - Envoy Gateway terminates TLS for auth.b8m.app and proxies HTTP to this service.
#   - Cloudflare Access gates the hostname with WARP-only policy (no login block),
#     plus an admin allowlist on /ui/console*. OIDC endpoints are Access-bypassed.
#
# Secrets wiring (via ExternalSecret -> onepassword-backend):
#   - masterkey (32 bytes, ASCII) consumed through masterkeySecretName (secret "zitadel-secrets")
#   - db password consumed via env (ZITADEL_DATABASE_POSTGRES_{USER,ADMIN}_PASSWORD),
#     sourced from secret "zitadel-db" (1Password item "postgresql", same as
#     the Ansible postgresql role that creates the DB role)
#
# Database:
#   - br-db1 の PostgreSQL が zitadel データベースとロールを作成済み
#     (provisioner/roles/postgresql)。zitadel ロールがデータベースを所有する
#     ため CREATE 権限は不要。initJob.command は "zitadel" にして
#     database/user/grant のプロビジョニングをスキップし、ZITADEL 自身の
#     schema init のみ実行する。
#
# SMTP: intentionally unset. Mail (invites / password reset) is disabled until
# Resend signup + DNS (SPF/DKIM/DMARC) is complete.

zitadel:
  masterkeySecretName: zitadel-secrets

  configmapConfig:
    ExternalDomain: auth.b8m.app
    ExternalSecure: true
    ExternalPort: 443
    # Envoy terminates TLS; Zitadel serves plain HTTP in-cluster.
    TLS:
      Enabled: false

    Database:
      Postgres:
        Host: rdbms.prod.internal-service.bright-room.net
        Port: 5432
        Database: zitadel
        MaxOpenConns: 10
        MaxIdleConns: 5
        MaxConnLifetime: 30m
        MaxConnIdleTime: 5m
        User:
          Username: zitadel
          SSL:
            Mode: require
        # br-db1 の PostgreSQL がデータベースとロールを作成済み
        # (provisioner/roles/postgresql); re-use the same role as
        # Admin since it owns the database.
        Admin:
          Username: zitadel
          SSL:
            Mode: require

# Top-level env (chart values expects it here, not under zitadel.*).
env:
  - name: ZITADEL_DATABASE_POSTGRES_USER_PASSWORD
    valueFrom:
      secretKeyRef:
        name: zitadel-db
        key: password
  - name: ZITADEL_DATABASE_POSTGRES_ADMIN_PASSWORD
    valueFrom:
      secretKeyRef:
        name: zitadel-db
        key: password

# Skip database/user/grant creation; br-db1 の PostgreSQL 側 (provisioner/roles/postgresql) が既に処理済み。
initJob:
  command: "zitadel"

service:
  type: ClusterIP

replicaCount: 1
