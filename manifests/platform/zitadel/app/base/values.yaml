# zitadel helm values (base)
#
# Authentication flow:
#   - Envoy Gateway terminates TLS for auth.b8m.app and proxies HTTP to this service.
#   - Cloudflare Access gates the hostname with WARP-only policy (no login block),
#     plus an admin allowlist on /ui/console*. OIDC endpoints are Access-bypassed.
#
# Secrets wiring (via ExternalSecret -> onepassword-backend -> secret "zitadel-secrets"):
#   - masterkey (32 bytes, ASCII) consumed through masterkeySecretName
#   - db_password consumed via env (ZITADEL_DATABASE_POSTGRES_{USER,ADMIN}_PASSWORD)
#
# Database:
#   - platform-pg CNPG cluster already created the zitadel database and role
#     via bootstrap.initdb. The zitadel role owns the database, so no CREATE
#     privileges are needed. initJob.command is set to "zitadel" to skip
#     database/user/grant provisioning and only run ZITADEL's own schema init.
#
# SMTP: intentionally unset. Mail (invites / password reset) is disabled until
# Resend signup + DNS (SPF/DKIM/DMARC) is complete.

zitadel:
  masterkeySecretName: zitadel-secrets

  configmapConfig:
    ExternalDomain: auth.b8m.app
    ExternalSecure: true
    ExternalPort: 443
    # Envoy terminates TLS; Zitadel serves plain HTTP in-cluster.
    TLS:
      Enabled: false

    Database:
      Postgres:
        Host: platform-pg-rw.platform-pg.svc.cluster.local
        Port: 5432
        Database: zitadel
        MaxOpenConns: 10
        MaxIdleConns: 5
        MaxConnLifetime: 30m
        MaxConnIdleTime: 5m
        User:
          Username: zitadel
          SSL:
            Mode: require
        # CNPG already provisioned DB + owner role; re-use the same role as
        # Admin since it owns the database.
        Admin:
          Username: zitadel
          SSL:
            Mode: require

# Top-level env (chart values expects it here, not under zitadel.*).
env:
  - name: ZITADEL_DATABASE_POSTGRES_USER_PASSWORD
    valueFrom:
      secretKeyRef:
        name: zitadel-secrets
        key: db_password
  - name: ZITADEL_DATABASE_POSTGRES_ADMIN_PASSWORD
    valueFrom:
      secretKeyRef:
        name: zitadel-secrets
        key: db_password

# Skip database/user/grant creation; CNPG already handled them.
initJob:
  command: "zitadel"

service:
  type: ClusterIP

replicaCount: 1
