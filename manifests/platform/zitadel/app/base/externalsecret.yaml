apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: zitadel-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword-backend
    kind: ClusterSecretStore
  target:
    name: zitadel-secrets
    template:
      data:
        masterkey: "{{ .masterkey }}"
        # DSN consumed by ZITADEL_DATABASE_POSTGRES_DSN. sslmode=require because
        # CNPG requires TLS by default (server cert signed by its internal CA,
        # not verified here — Envoy/Zitadel traffic stays inside the cluster).
        dsn: "postgres://zitadel:{{ .db_password }}@platform-pg-rw.platform-pg.svc.cluster.local:5432/zitadel?sslmode=require"
  data:
    - secretKey: masterkey
      remoteRef:
        key: zitadel
        property: masterkey
    - secretKey: db_password
      remoteRef:
        key: zitadel
        property: db_password
    # smtp-password is added in a later PR once Resend is provisioned.
