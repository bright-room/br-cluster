# Drives `terraform plan` / `apply` inside the cluster against this cluster's
# own Zitadel instance. State is stored as a Secret under the tofu-controller
# namespace (kubernetes backend, injected by the controller), so state lifecycle
# matches the cluster lifecycle.
#
# Service-user auth: varsFrom exposes each key of iam-admin-pat as a TF
# variable of the same name. The Helm-generated Secret uses key `pat`, so the
# TF side declares `variable "pat"`. Passing TF_VAR_* directly via
# runnerPodTemplate.env is rejected by tofu-controller (TFExecInitFailed).
apiVersion: infra.contrib.fluxcd.io/v1alpha2
kind: Terraform
metadata:
  name: zitadel
  namespace: zitadel
spec:
  interval: 10m
  approvePlan: auto
  path: ./terraform
  serviceAccountName: tf-runner
  sourceRef:
    kind: GitRepository
    name: zitadel-terraform
    namespace: flux-system
  vars:
    - name: zitadel_domain
      value: auth.b8m.app
  varsFrom:
    - kind: Secret
      name: iam-admin-pat
      varsKeys:
        - pat
  writeOutputsToSecret:
    name: tf-zitadel-output
