# Drives `terraform plan` / `apply` inside the cluster against this cluster's
# own Zitadel instance. State is stored as a Secret under the tofu-controller
# namespace (kubernetes backend, injected by the controller), so state lifecycle
# matches the cluster lifecycle.
#
# Service-user auth: the zitadel/zitadel provider's `jwt_profile_file`
# attribute wants a filesystem path to the IAM admin's JWT profile JSON.
# Mount the Helm-generated iam-admin Secret (single key iam-admin.json) at
# /secrets/zitadel-admin/ in the runner pod; the provider block in the TF
# repo reads it from there.
#
# DNS: the provider's domain is auth.b8m.app because that's the
# ExternalDomain Zitadel was configured with. The CoreDNS base values
# rewrite that name to zitadel.zitadel.svc.cluster.local cluster-wide,
# so the runner pod (and anyone else inside the cluster) reaches Zitadel
# without going through the CF Tunnel and getting blocked by Access.
apiVersion: infra.contrib.fluxcd.io/v1alpha2
kind: Terraform
metadata:
  name: zitadel
  namespace: zitadel
spec:
  interval: 10m
  approvePlan: auto
  path: ./terraform
  serviceAccountName: tf-runner
  sourceRef:
    kind: GitRepository
    name: zitadel-terraform
    namespace: flux-system
  vars:
    - name: zitadel_domain
      value: auth.b8m.app
  # SMTP creds for the zitadel_smtp_config resource. Keys in the Secret
  # become TF_VAR_* names; variable names are declared in the TF repo.
  varsFrom:
    - kind: Secret
      name: zitadel-smtp-creds
  runnerPodTemplate:
    spec:
      volumes:
        - name: zitadel-admin
          secret:
            secretName: iam-admin
      volumeMounts:
        - name: zitadel-admin
          mountPath: /secrets/zitadel-admin
          readOnly: true
  writeOutputsToSecret:
    name: tf-zitadel-output
