# GitHub PAT used by Flux to clone br-cluster-zitadel-terraform (private repo).
#
# Expected 1Password item layout (set up once, persists across cluster rebuilds):
#   item:     github-flux-deploy-token
#   fields:
#     username: anything readable (e.g. "flux")  — basic auth user field, value
#               is ignored by GitHub when the password is a PAT, but Flux requires
#               a non-empty username
#     password: a fine-grained / classic PAT with read-only contents on
#               bright-room/br-cluster-zitadel-terraform (at minimum)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: zitadel-terraform-repo-auth
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword-backend
    kind: ClusterSecretStore
  target:
    name: zitadel-terraform-repo-auth
    template:
      type: Opaque
      data:
        username: "{{ .username }}"
        password: "{{ .password }}"
  data:
    - secretKey: username
      remoteRef:
        key: github-flux-deploy-token
        property: username
    - secretKey: password
      remoteRef:
        key: github-flux-deploy-token
        property: password
