apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: zitadel-b8m
  namespace: zitadel
  annotations:
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "true"
spec:
  parentRefs:
    - name: cluster-gateway
      namespace: envoy-gateway-system
      sectionName: https
  hostnames:
    - "auth.${CLUSTER_DOMAIN}"
  rules:
    - backendRefs:
        - name: zitadel
          port: 8080
