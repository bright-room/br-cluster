---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: istio-ztunnel
spec:
  interval: 30m
  url: https://istio-release.storage.googleapis.com/charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: istio-ztunnel
spec:
  interval: 30m
  chart:
    spec:
      chart: ztunnel
      version: 1.29.1
      sourceRef:
        kind: HelmRepository
        name: istio-ztunnel
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  valuesFrom:
  - kind: ConfigMap
    name: istio-ztunnel-helm-values
    valuesKey: base-values.yaml
