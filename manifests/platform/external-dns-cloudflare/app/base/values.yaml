---
# external-dns helm values (base) — Cloudflare provider
provider:
  name: cloudflare

# Pin image to app v0.21.0 (chart 1.20.0 still ships 0.20.0).
# v0.21.0 migrates the gateway-api source to Gateway API v1 natively.
# Prior versions watched v1beta1 and lost annotations on v1 HTTPRoutes,
# which caused external-dns.alpha.kubernetes.io/target to be ignored
# and A records (gateway IP) to be created instead of CNAMEs.
image:
  tag: v0.21.0

sources:
  - gateway-httproute

domainFilters:
  - b8m.app

# Conservative default — overlays can switch to sync once stable
policy: upsert-only

# Distinct owner ID so records don't collide with any other external-dns instance
txtOwnerId: br-cluster-prod
registry: txt

env:
  - name: CF_API_TOKEN
    valueFrom:
      secretKeyRef:
        name: externaldns-cloudflare-token
        key: apiToken

# Raspberry Pi kube-apiserver gets throttled at the default client QPS when
# informers have to list-watch many Gateway API resources at startup. The
# initial cache sync then exceeds external-dns's 1m hard deadline and the
# process crashes with "failed to sync *v1.Gateway after 1m0s". Raising
# the client QPS / burst lets the startup list complete in time.
extraArgs:
  - --kube-api-qps=50
  - --kube-api-burst=100
