---
extends: default

ignore: |
  provisioner/collections/
  provisioner/roles/ipr-cnrs.nftables/
  .secret/
  .generated/
  uv.lock

rules:
  line-length:
    max: 200
    level: warning
  truthy:
    allowed-values: ["true", "false", "on"]  # GitHub Actions uses `on:`
  comments:
    min-spaces-from-content: 1
  comments-indentation: disable
  # 既存 manifest はマルチドキュメント (`*-app.yaml`) で `---` を使い、
  # 単ドキュメントの kustomization 等は `---` 無し、という mixed 運用。
  # 統一する価値が薄いので check しない。
  document-start: disable
  indentation:
    spaces: 2
    # 既存 manifest が `patches:` を indent しない流儀の所と indent する所を
    # 混在させているので、sequence の indent は問わない。
    indent-sequences: whatever
  braces:
    max-spaces-inside: 1
  octal-values:
    forbid-implicit-octal: true
    forbid-explicit-octal: false
